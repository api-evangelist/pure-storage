openapi: 3.2.0
info:
  title: Pure Storage Hardware API
  x-refined-note:
  - x-logo differs across the merged source definitions and was not carried
  - x-pure-description-ref differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Hardware across 3 of this provider''s published API definitions: flasharray-rest-api-openapi.yml, flashblade-rest-api-openapi.yml, pure1-cloud-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /
- url: http://[array]/
- url: https://[array]/
- url: https://api-staging.pure1.purestorage.com/
tags:
- name: Hardware
  description: 'Operational status is reported by most of the hardware components in an array, including the

    chassis, controller, and storage shelf.'
paths:
  /api/2.52/hardware:
    get:
      tags:
      - Hardware
      summary: Pure Storage List Hardware Component Information
      description: Displays a list of hardware slots and bays and status of installed components.
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Filter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Names'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Total_item_count'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareGetResponse'
      operationId: getApi252Hardware
      x-operation-id-source: derived
    patch:
      tags:
      - Hardware
      summary: Pure Storage Modify Visual Identification
      description: Modifies the visual identification of a specified hardware component, and causing the ID LED to turn on or off.
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Names'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardwarePatch'
        required: true
        x-codegen-request-body-name: hardware
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareResponse'
      x-codegen-request-body-name: hardware
      operationId: patchApi252Hardware
      x-operation-id-source: derived
    servers:
    - url: /
  /api/2.26/hardware:
    get:
      tags:
      - Hardware
      summary: Pure Storage GET Hardware
      description: List hardware slots and bays and the status of installed components.
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Continuation_token'
      - $ref: '#/components/parameters/Filter'
      - $ref: '#/components/parameters/Ids'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Names'
      - $ref: '#/components/parameters/Offset_2'
      - $ref: '#/components/parameters/Sort_2'
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              description: Supplied by client during request or generated by server.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareGetResponse'
      security:
      - AuthorizationHeader: []
      operationId: getApi226Hardware
      x-operation-id-source: derived
    patch:
      tags:
      - Hardware
      summary: Pure Storage PATCH Hardware
      description: Controls the visual identification light of the specified hardware component.
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Ids'
      - $ref: '#/components/parameters/Names'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hardware_2'
        required: true
        x-codegen-request-body-name: hardware
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              description: Supplied by client during request or generated by server.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareResponse_2'
      x-codegen-request-body-name: hardware
      security:
      - AuthorizationHeader: []
      operationId: patchApi226Hardware
      x-operation-id-source: derived
    servers:
    - url: http://[array]/
    - url: https://[array]/
  /api/1.5/hardware:
    get:
      tags:
      - Hardware
      summary: Pure Storage Get Hardware
      description: Retrieves information about hardware components.
      parameters:
      - $ref: '#/components/parameters/Authorization_2'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Continuation_token_2'
      - $ref: '#/components/parameters/Filter_2'
      - $ref: '#/components/parameters/Ids_2'
      - $ref: '#/components/parameters/Limit_2'
      - $ref: '#/components/parameters/Names_2'
      - $ref: '#/components/parameters/Offset_3'
      - $ref: '#/components/parameters/Sort_3'
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              description: Supplied by client during request or generated by server.
              schema:
                type: string
            X-RateLimit-Remaining-second:
              description: 'The number of requests remaining for the organization in that second.

                '
              schema:
                type: integer
            X-RateLimit-Remaining-minute:
              description: 'The number of requests remaining for the organization in that minute.

                '
              schema:
                type: integer
            X-RateLimit-Limit-second:
              description: The number of requests available per second.
              schema:
                type: integer
            X-RateLimit-Limit-minute:
              description: The number of requests available per minute.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareGetResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      security:
      - AuthorizationHeader: []
      operationId: getApi15Hardware
      x-operation-id-source: derived
    servers:
    - url: https://api-staging.pure1.purestorage.com/
components:
  schemas:
    Hardware:
      allOf:
      - $ref: '#/components/schemas/_builtInResourceNoId'
      - type: object
        properties:
          details:
            description: 'Details about the status of the component if not healthy.

              '
            type: string
            readOnly: true
            example: Temperature too high
          identify_enabled:
            description: 'If `true`, the ID LED is lit to visually identify the component.

              '
            type: boolean
            readOnly: true
            example: true
          index:
            description: 'Number that identifies the relative position of a hardware component within the array.

              '
            type: integer
            format: int32
            readOnly: true
            example: 1
          model:
            description: 'Model number of the hardware component.

              '
            type: string
            readOnly: true
            example: DFSC1
          serial:
            description: 'Serial number of the hardware component.

              '
            type: string
            readOnly: true
            example: PSMFL1717009B
          slot:
            description: 'Slot number occupied by the PCI Express card that hosts the component.

              '
            type: integer
            format: int32
            readOnly: true
            example: 16
          speed:
            description: 'Speed (in bytes per second) at which the component is operating.

              '
            type: integer
            format: int64
            readOnly: true
            example: 24000000000
          status:
            description: 'Component status.

              Values include `critical`, `healthy`, `identifying`, `unhealthy`, `unknown`, and `unused`.

              '
            type: string
            readOnly: true
            example: critical
          temperature:
            description: 'Temperature (in degrees Celsius) reported by the component.

              '
            type: integer
            format: int32
            readOnly: true
            example: 25
          type:
            description: 'The type of hardware component. Values include `chassis`, `cooling`, `controller`,

              `direct_compress_accelerator`, `drive_bay`, `eth_port`, `fc_port`, `ib_port`, `sas_module`,

              `sas_port`, `storage_shelf`, `temp_sensor`, and `power_supply`.

              '
            type: string
            readOnly: true
            example: controller
          voltage:
            description: 'Voltage (in Volts) reported by the component.

              '
            type: integer
            format: int32
            readOnly: true
            example: 206
    HardwareGetResponse:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - $ref: '#/components/schemas/HardwareResponse'
    _builtInResourceNoId:
      description: 'A built-in resource. Many are singletons predefined by Purity (e.g., support

        settings). Some correspond to a piece of software, like an app, or hardware,

        like a controller. Others are created by the system in response to some event

        (e.g., alerts, audit records).


        Typically, a user can''t create, delete or rename a built-in resource. A few

        can be created or deleted, but not renamed because the names are meaningful

        to Purity (e.g., VIFs, file systems, file system snapshots, volume snapshot).

        '
      type: object
      properties:
        name:
          description: 'A locally unique, system-generated name. The name cannot be modified.

            '
          type: string
          readOnly: true
    HardwareResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Hardware'
    PageInfo:
      type: object
      properties:
        continuation_token:
          description: 'Continuation token that can be provided in the `continuation_token`

            query param to get the next page of data.

            If you use the continuation token to page through data you

            are guaranteed to get all items exactly once regardless of

            how items are modified. If an item is added or deleted during

            the pagination then it may or may not be returned.

            The continuation token is generated if the limit is less

            than the remaining number of items, and the default sort is used

            (no sort is specified).

            '
          type: string
        more_items_remaining:
          description: 'Returns a value of `true` if subsequent items can be retrieved.

            '
          type: boolean
          example: false
        total_item_count:
          description: 'The total number of records after applying all filter query parameters.

            The `total_item_count` will be calculated if and only if the corresponding

            query parameter `total_item_count` is set to `true`. If this query parameter

            is not set or set to `false`, a value of `null` will be returned.

            '
          type: integer
          format: int32
    HardwarePatch:
      allOf:
      - $ref: '#/components/schemas/_builtInResourceNoId'
      - type: object
        properties:
          identify_enabled:
            description: 'State of an LED used to visually identify the component.

              '
            type: boolean
            example: true
          index:
            description: 'Number that identifies the relative position of a hardware component within the array.

              '
            type: integer
            format: int32
            example: 1
    HardwareTemperatures:
      description: 'Provides detailed information about temperature readings from a sensor,

        including its status and threshold limits.

        '
      type: object
      properties:
        name:
          description: The name of the temperature sensor.
          type: string
          readOnly: true
        reading:
          description: The latest temperature measurement reported by the sensor.
          type: number
          format: double
          readOnly: true
        status:
          description: 'The current operational state of the sensor,

            indicating whether it is functioning normally or experiencing issues.

            Possible values include HEALTHY, NON_CRITICAL, CRITICAL, UNRECOVERABLE, UNKNOWN.

            '
          type: string
          readOnly: true
        thresholds:
          $ref: '#/components/schemas/HardwareTemperaturesThresholds'
    HardwareTemperaturesThresholds:
      description: 'The predefined temperature thresholds for the sensor, specifying acceptable operational limits.

        '
      type: object
      properties:
        critical:
          description: 'The temperature level indicating that the system is under increased load.

            While still operational, it may require monitoring or adjustments to maintain optimal performance.

            '
          type: number
          format: double
          readOnly: true
        non_critical:
          description: 'The temperature level at which the system operates normally without any concerns.

            '
          type: number
          format: double
          readOnly: true
        unrecoverable:
          description: 'The maximum temperature limit beyond which the system may experience irreversible failure.

            Immediate action is required to prevent damage or shutdown.

            '
          type: number
          format: double
          readOnly: true
    Hardware_2:
      allOf:
      - $ref: '#/components/schemas/_builtIn'
      - type: object
        properties:
          data_mac:
            description: 'Ethernet (data) MAC address

              '
            type: string
            readOnly: true
            example: fa:16:3e:a1:c6:ce
          details:
            description: 'Details about the status of the component if not healthy.

              '
            type: string
            readOnly: true
            example: Temperature too high
          identify_enabled:
            description: 'State of an LED used to visually identify the component.

              '
            type: boolean
            example: true
          index:
            description: 'Number that identifies the relative position of a hardware component

              within the array.

              '
            type: integer
            format: int32
            readOnly: true
            example: 1
          management_mac:
            description: 'Hardware component (burned-in) MAC address

              '
            type: string
            readOnly: true
            example: 24:a9:37:ca:a0:d0
          model:
            description: Model number of the hardware component.
            type: string
            readOnly: true
            example: FB-8TB
          part_number:
            description: 'Part number of the hardware component.

              '
            type: string
            readOnly: true
            example: 83-0139-01
          sensor_readings:
            type: array
            readOnly: true
            items:
              $ref: '#/components/schemas/HardwareTemperatures'
          serial:
            description: Serial number of the hardware component.
            type: string
            readOnly: true
            example: S16445515B09553
          slot:
            description: 'Slot number occupied by the PCI Express card that hosts the component.

              '
            type: integer
            format: int32
            readOnly: true
            example: 16
          speed:
            description: The maximum speed (in b/s) at which the component is capable of operating.
            type: integer
            format: int64
            readOnly: true
            example: 10000000000
          status:
            description: 'Component status.

              Valid values are `critical`, `healthy`, `identifying`, `unhealthy`,

              `unknown`, and `unused`.

              '
            type: string
            readOnly: true
            example: critical
          temperature:
            description: Temperature (in degrees celsius) reported by the component.
            type: integer
            format: int32
            readOnly: true
            example: 25
          type:
            description: 'Type of hardware component.

              Valid values are `bay`, `ch`, `eth`, `fan`, `fb`, `fm`, `pwr`, and `xfm`.

              '
            type: string
            readOnly: true
            example: ch
    _builtIn:
      type: object
      properties:
        id:
          description: 'A non-modifiable, globally unique ID chosen by the system.

            '
          type: string
          readOnly: true
        name:
          description: Name of the object (e.g., a file system or snapshot).
          type: string
          readOnly: true
    HardwareResponse_2:
      type: object
      properties:
        items:
          description: A list of hardware component objects.
          type: array
          items:
            $ref: '#/components/schemas/Hardware_2'
    PageInfo_2:
      type: object
      properties:
        continuation_token:
          description: 'Continuation token that can be provided in the `continuation_token` query

            param to get the next page of data.

            If you use the `continuation_token` to page through data you

            are guaranteed to get all items exactly once regardless of

            how items are modified. If an item is added or deleted during

            the pagination then it may or may not be returned.

            The `continuation_token` is generated if the `limit` is less

            than the remaining number of items, and the default sort is used

            (no sort is specified).

            '
          type: string
        total_item_count:
          description: Total number of items after applying `filter` params.
          type: integer
          format: int32
    _fixedReferenceFqdn:
      allOf:
      - $ref: '#/components/schemas/_fixedReference'
      - type: object
        properties:
          fqdn:
            description: 'The fully qualified domain name of the appliance when `resource_type` is `arrays`,

              `null` otherwise.

              '
            type: string
            readOnly: true
            example: example_name.dc1.example.com
    _arraysBuiltIn:
      description: 'A built-in resource that exists on one or multiple arrays.

        '
      allOf:
      - $ref: '#/components/schemas/_builtInAsOf'
      - $ref: '#/components/schemas/_arrays'
    _errorErrors:
      type: object
      properties:
        context:
          type: string
          example: Error with ...
        message:
          type: string
          example: Something was wrong
    _arrays:
      type: object
      properties:
        arrays:
          description: 'The list of arrays where this resource exists. Many resources are on a single array, but

            some resources, such as pods, can be shared across multiple arrays.

            '
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/_fixedReferenceFqdn'
      x-readOnly: true
    PageInfo_3:
      type: object
      properties:
        continuation_token:
          description: 'Continuation token that can be provided in the continuation_token

            query param to get the next page of data.

            If you use the continuation token to page through data you

            are guaranteed to get all items exactly once regardless of

            how items are modified. If an item is added or deleted during

            the pagination then it may or may not be returned.

            The continuation token is generated if the limit is less

            than the remaining number of items, and the default sort is used

            (no sort is specified).

            '
          type: string
          example: MThkMzJmYWUtZDI3OS00ODEzLWIzODYtMmM3NmFhMTMwM2My
        total_item_count:
          description: Total number of items after applying filter params.
          type: integer
          format: int32
          example: 1
    _fixedReference:
      type: object
      properties:
        id:
          description: The opaque and unique id of this resource.
          type: string
          readOnly: true
          example: 2a989a09-c851-4d52-9ec6-ab728b1c04db
        name:
          description: The name of this resource.
          type: string
          readOnly: true
          example: example_name
        resource_type:
          description: 'The type of this resource represented by the name of its REST endpoint.

            For example, "arrays", "network-interfaces", and "metrics".

            The value may be `null` if the resource is not represented.

            '
          type: string
          readOnly: true
          example: example_resource_type
      x-readOnly: true
    Error:
      type: object
      properties:
        errors:
          description: The list of errors encountered.
          type: array
          items:
            $ref: '#/components/schemas/_errorErrors'
    _builtInAsOf:
      description: 'A built-in resource. Many are singletons predefined by Purity (e.g., support

        settings). Some correspond to a piece of software, like an app, or hardware,

        like a controller. Others are created by the system in response to some event

        (e.g., alerts, audit records).


        Typically, a user can''t create, delete or rename a built-in resource. A few

        can be created or deleted, but not renamed because the names are meaningful

        to Purity (e.g., VIFs).


        '
      allOf:
      - $ref: '#/components/schemas/_timeAware'
      - type: object
        properties:
          id:
            description: A non-modifiable, globally unique ID chosen by the system.
            type: string
            readOnly: true
            example: 01c2889a-4124-49ff-8cbd-c33405ede123
          name:
            description: A non-modifiable, locally unique name chosen by the system.
            type: string
            readOnly: true
            example: example_name
    Hardware_3:
      allOf:
      - $ref: '#/components/schemas/_arraysBuiltIn'
      - description: 'A hardware component.

          '
        type: object
        properties:
          details:
            description: 'Details about the component if `status` is not `healthy`.

              '
            type: string
            example: Temperature too high
          identify_enabled:
            description: If true, the ID light is lit to visually identify the component.
            type: boolean
            example: true
          model:
            description: 'Model number of the hardware component.

              '
            type: string
            example: DFSC1
          serial:
            description: 'Serial number of the hardware component.

              '
            type: string
            example: PSMFL1717009B
          slot:
            description: 'Slot number occupied by the PCI Express card that hosts the component.

              '
            type: integer
            format: int32
            example: 16
          speed:
            description: 'Speed (in bytes per second) at which the component is operating.

              '
            type: integer
            format: int64
            example: 24000000000
          status:
            description: 'Component status. Values include `critical`, `healthy`, `identifying`,

              `unhealthy`, `unclaimed`, `unknown`, `unrecognized`, and `unused`.

              '
            type: string
            example: critical
          temperature:
            description: 'Temperature (in degrees Celsius) reported by the component.

              '
            type: integer
            format: int32
            example: 25
          type:
            description: 'Type of the hardware component. Values include `am`, `chassis`, `controller`, `cooling`,

              `drive_bay`, `eth_port`, `fan`, `fc_port`, `flash_blade`, `ib_port`, `mgmt_port`,

              `nvram_bay`, `power_supply`, `sas_module`, `sas_port`, `storage_shelf`, and `temp_sensor`.

              '
            type: string
            example: controller
          voltage:
            description: 'Voltage (in Volts) reported by the component.

              '
            type: integer
            format: int32
            example: 206
    ErrorNoContext:
      type: object
      properties:
        message:
          type: string
          example: Something was wrong
    _timeAware:
      type: object
      properties:
        _as_of:
          description: The freshness of the data (timestamp in millis since epoch).
          type: integer
          format: int64
          readOnly: true
          example: 1502729489760
  parameters:
    Authorization:
      name: Authorization
      in: header
      description: 'Access token (in JWT format) required to use any API

        endpoint (except `/oauth2`, `/login`, and `/logout`)

        '
      schema:
        type: string
    Filter:
      name: filter
      in: query
      description: 'Narrows down the results to only the response objects

        that satisfy the filter criteria.

        '
      schema:
        type: string
    Sort:
      name: sort
      in: query
      description: "Sorts the response objects by the specified fields. Sorting can be applied to any field name\n in the response, in ascending order by default, or in descending order by prefixing the\n field name with a minus sign (-). Multiple fields can be specified as a comma-separated\n list (e.g., sort volumes by size descending, then by name ascending). If sort is provided,\n the response will not include a continuation_token.\n"
      style: form
      explode: false
      schema:
        type: array
        items:
          pattern: ^[a-z]+(_[a-z]+)*-?
          type: string
    Offset:
      name: offset
      in: query
      description: 'The starting position based on the results of the query

        in relation to the full set of response objects returned.

        '
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 10
    XRequestId:
      name: X-Request-ID
      in: header
      description: 'Supplied by client during request or generated by server.

        '
      schema:
        type: string
    Names:
      name: names
      in: query
      description: 'Performs the operation on the unique names specified.

        Enter multiple names in comma-separated format.

        For example, `name01,name02`.


        If there is not at least one resource that matches

        each of the elements of `names`, then an error is returned,

        except when creating new resources.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Total_item_count:
      name: total_item_count
      in: query
      description: 'If set to `true`, the `total_item_count` matching the

        specified query parameters is calculated and returned in

        the response. If set to `false`, the `total_item_count`

        is `null` in the response. This may speed up queries

        where the `total_item_count` is large. If not specified,

        defaults to `false`.

        '
      schema:
        type: boolean
    Limit:
      name: limit
      in: query
      description: 'Limits the size of the response to the specified number of objects on each page.

        To return the total number of resources, set `limit=0`.

        The total number of resources is returned as a `total_item_count` value.

        If the page size requested is larger than the system maximum limit,

        the server returns the maximum limit, disregarding the requested page size.

        '
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 10
    Sort_2:
      name: sort
      in: query
      description: 'Sort the response by the specified fields (in descending order if ''-''

        is appended to the field name).

        NOTE: If you provide a sort you will not get a `continuation_token` in

        the response.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          pattern: ^[a-z]+(_[a-z]+)*-?
          type: string
    Offset_2:
      name: offset
      in: query
      description: 'The offset of the first resource to return from a collection.

        '
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 10
    Continuation_token:
      name: continuation_token
      in: query
      description: 'A token used to retrieve the next page of data

        with some consistency guaranteed.

        The token is a Base64 encoded value.

