components:
  schemas:
    _builtInNoId:
      type: object
      properties:
        name:
          description: Name of the object (e.g., a file system or snapshot).
          type: string
          readOnly: true
    StorageClassInfo:
      allOf:
      - $ref: '#/components/schemas/_referenceNameOnly'
      - type: object
        properties:
          status:
            description: The status of the transition from the policy to the requested policy. If there is an ongoing transition, the status will be one of `In-Progress` or `Queued`. If there is no transition ongoing, this field will be null.
            type: string
            readOnly: true
          status_details:
            description: Additional details about the status of the transition. If there is no transition ongoing, this field will be null.
            type: string
            readOnly: true
          tiering_policy:
            description: 'The storage class tiering policy defines tiering for data within the container. If specified,

              data is written to the container''s `S500X-S` (speed) storage class by default, then tiered

              to `S500X-A` (archival) storage class based on the policy.

              If not specified, all data in the container is written to the container''s current storage class.

              '
            title: Reference
            allOf:
            - $ref: '#/components/schemas/_reference_2'
    FileSystemGroupsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileSystemGroup'
          description: A list of quota objects.
    FileSystemClient:
      allOf:
      - $ref: '#/components/schemas/_builtInNoId'
      - $ref: '#/components/schemas/_context_2'
    _smbPost:
      allOf:
      - $ref: '#/components/schemas/_smb'
      - type: object
        properties:
          client_policy:
            description: 'The SMB Client policy for the file system. Setting a policy here grants

              access permissions (e.g. read-only or read-write) to the file system via

              SMB on a per-client basis.

              Defaults to a pre-defined full access policy if none is specified.

              '
            title: ReferenceWritable
            allOf:
            - $ref: '#/components/schemas/_referenceWritable'
          share_policy:
            description: 'The SMB Share policy for the file system. Setting a policy here

              grants access permissions (e.g. allow or deny Full Control, Change,

              and/or Read) to the file system via SMB on a per-user / per-group basis.

              Defaults to a pre-defined full access policy if none is specified.

              '
            title: ReferenceWritable
            allOf:
            - $ref: '#/components/schemas/_referenceWritable'
    _smb:
      type: object
      properties:
        client_policy:
          description: 'Deprecated. See File System Exports for newer functionality.

            The value returned will be the `client_policy` of the File System

            Export for the default server, and SMB, with the `export_name`

            matching the file system name, if there is one and null otherwise.

            Modifying this field will still work.

            If the current value is null, then setting this field will attempt

            to create a File System Export with the `client_policy`

            and other default values. The `export_name` will be the same as the

            file system''s `name`.

            If the current value is not null, then setting this field will change

            the `client_policy` in the matching File System Export.

            The SMB Client policy for the file system. Setting a policy here grants

            access permissions (e.g. read-only or read-write) to the file system via

            SMB on a per-client basis.

            If no policy is set here, no client will have access.

            Use "" to clear.

            '
          title: ReferenceWritable
          allOf:
          - $ref: '#/components/schemas/_referenceWritable'
        continuous_availability_enabled:
          description: 'If set to `true`, the file system will be continuously available during

            disruptive scenarios such as network disruption, blades failover, etc.

            If not specified, defaults to `true`.

            '
          type: boolean
        enabled:
          description: 'If set to `true`, enables access to the file system over the SMB

            protocol. If not specified, defaults to `false`.

            '
          type: boolean
        share_policy:
          description: 'Deprecated. See File System Exports for newer functionality.

            The value returned will be the `policy` of the File System

            Export for the default server, and SMB, with the `export_name`

            matching the file system name, if there is one and null otherwise.

            Modifying this field will still work.

            If the current value is null, then setting this field will attempt

            to create a File System Export with the policy

            and other default values. The `export_name` will be the same as the

            file system''s `name`.

            If the current value is not null, then setting this field will change

            the `policy` in the matching File System Export.

            The SMB Share policy for the file system. Setting a policy here

            grants access permissions (e.g. allow or deny Full Control, Change,

            and/or Read) to the file system via SMB on a per-user / per-group basis.

            If no policy is set here, no user or group will have access.

            Use "" to clear.

            '
          title: ReferenceWritable
          allOf:
          - $ref: '#/components/schemas/_referenceWritable'
    _timeAware:
      type: object
      properties:
        _as_of:
          description: The freshness of the data (timestamp in millis since epoch).
          type: integer
          format: int64
          readOnly: true
          example: 1502729489760
    ErrorNoContext:
      type: object
      properties:
        message:
          type: string
          example: Something was wrong
    _http_2:
      type: object
      properties:
        enabled:
          description: Is the protocol enabled?
          type: boolean
          example: false
    _referenceWritable:
      allOf:
      - $ref: '#/components/schemas/_referenceWithoutType'
      - type: object
        properties:
          resource_type:
            description: 'Type of the object (full name of the endpoint).

              Valid values are `hosts`, `host-groups`, `network-interfaces`, `pods`,

              `ports`, `pod-replica-links`, `subnets`, `volumes`, `volume-snapshots`,

              `volume-groups`, `directories`, `policies/nfs`, `policies/smb`, `policies/snapshot`, etc.

              '
            type: string
      x-aliases:
      - _reference
    UserGroupQuotaPoliciesMembersGetResponse:
      allOf:
      - $ref: '#/components/schemas/PageInfo_2'
      - $ref: '#/components/schemas/UserGroupQuotaPoliciesMembersResponse'
      - $ref: '#/components/schemas/_errorContextResponse_2'
    FileSystemGroup:
      allOf:
      - $ref: '#/components/schemas/_context_2'
      - properties:
          file_system:
            $ref: '#/components/schemas/_fixedReference_2'
          group:
            description: The group on which this quota is enforced.
            title: GroupSubject
            allOf:
            - $ref: '#/components/schemas/_groupSubject'
          limited_by:
            description: The policy that is limiting usage for this group in this file system and the limiting rule.
            title: UserGroupQuotaLimitedBy
            allOf:
            - $ref: '#/components/schemas/UserGroupQuotaLimitedBy'
          percentage_used:
            description: 'The ratio of the quota usage to the quota limit, with 1.0 meaning that the

              usage has reached the quota limit.

              '
            type: number
