      x-codegen-request-body-name: file-system
    delete:
      tags:
      - File Systems
      summary: Pure Storage DELETE File-systems
      description: Deletes a file system. Deleting a file system is equivalent to eradication. A file system's `destroyed` parameter must be set to `true` before a file system can be deleted.
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Context_names'
      - $ref: '#/components/parameters/Ids_2'
      - $ref: '#/components/parameters/Names'
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              description: Supplied by client during request or generated by server.
              schema:
                type: string
          content: {}
    patch:
      tags:
      - File Systems
      summary: Pure Storage PATCH File-systems
      description: Modify a file system's attributes including its export protocols and limits.
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Cancel_storage_class_transition'
      - $ref: '#/components/parameters/Context_names'
      - $ref: '#/components/parameters/Delete_link_on_eradication'
      - $ref: '#/components/parameters/Discard_detailed_permissions'
      - $ref: '#/components/parameters/Discard_non_snapshotted_data'
      - $ref: '#/components/parameters/Ids_2'
      - $ref: '#/components/parameters/Ignore_usage'
      - $ref: '#/components/parameters/Names'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileSystemPatch_2'
        required: true
        x-codegen-request-body-name: file-system
      responses:
        '200':
          description: OK
