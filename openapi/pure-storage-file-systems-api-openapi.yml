openapi: 3.0.1
info:
  title: FlashArray REST Active Directory File Systems API
  version: '2.52'
  description: 'Active Directory configuration authenticates users for NFS using Kerberos or SMB using Kerberos

    or New Technology LAN Manager (NTLM). Active Directory is also used to authorize users by

    mapping identities across the NFS and SMB protocols by using LDAP queries.

    '
servers:
- url: /
tags:
- name: File Systems
  description: 'A FlashArray can contain up to 24 separate file systems, each with a number of directories that

    can be exported via supported protocols. Clients, using Active Directory or LDAP, can connect

    and access these exports using SMB or NFS.

    '
paths:
  /api/2.52/file-systems:
    get:
      tags:
      - File Systems
      summary: Pure Storage List File Systems
      description: 'Displays a list of file systems, including those pending eradication.

        '
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Allow_errors'
      - $ref: '#/components/parameters/Context_names_get'
      - $ref: '#/components/parameters/Continuation_token'
      - $ref: '#/components/parameters/Destroyed'
      - $ref: '#/components/parameters/Filter'
      - $ref: '#/components/parameters/Ids'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Names'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Total_item_count'
      - $ref: '#/components/parameters/Workload_ids'
      - $ref: '#/components/parameters/Workload_names'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSystemGetResponse'
        '207':
          description: 'Partial success. Some resources were returned, but there

            were also errors possibly preventing some resources from

            being returned.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSystemGetResponse'
    post:
      tags:
      - File Systems
      summary: Pure Storage Create File System
      description: 'Creates one or more file systems.

        The `add_to_policy_names` and `add_to_policy_ids` query parameters specify a list of policy

        names or ids, respectively, that will be applied to the root directory

        of the newly created file system. These parameters are mutually exclusive.

        The `with_default_protection` query parameter specifies whether to use the container

        default protection configuration for the root directory of the file system.

        '
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Add_to_policy_ids_file_system'
      - $ref: '#/components/parameters/Add_to_policy_names_file_system'
      - $ref: '#/components/parameters/Context_names'
      - $ref: '#/components/parameters/Names'
      - $ref: '#/components/parameters/With_default_protection_policy_file_system'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileSystemPost'
        x-codegen-request-body-name: file-system
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSystemResponse'
    delete:
      tags:
      - File Systems
      summary: Pure Storage Delete File System
      description: 'Deletes a file system that has been destroyed and is pending eradication.

        Eradicated file systems cannot be recovered. File systems are destroyed using the PATCH method.

        '
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Context_names'
      - $ref: '#/components/parameters/Ids'
      - $ref: '#/components/parameters/Names'
      responses:
        '200':
          description: OK
          content: {}
    patch:
      tags:
      - File Systems
      summary: Pure Storage Modify a File System
      description: 'Modifies a file system. You can rename, destroy, move, or recover a file system.

        To rename a file system, set `name` to the new name.

        To destroy a file system, set `destroyed=true`.

        To move a file system, set ''pod'' to the destination pod reference.

        To recover a file system that has been destroyed and is pending eradication,

        set `destroyed=false`.

        '
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Context_names'
      - $ref: '#/components/parameters/Ids'
      - $ref: '#/components/parameters/Names'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileSystemPatch'
        required: true
        x-codegen-request-body-name: file-system
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSystemResponse'
      x-codegen-request-body-name: file-system
  /api/2.26/file-systems:
