            schema:
              $ref: '#/components/schemas/FileSystemPost_2'
        required: true
        x-codegen-request-body-name: file-system
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              description: Supplied by client during request or generated by server.
              schema:
                type: string
          content:
