            $ref: '#/components/schemas/BucketAccessPolicyRuleWithContext'
    _objectLockConfigResponse:
      allOf:
      - $ref: '#/components/schemas/_objectLockConfigBase'
      - type: object
        properties:
          default_retention:
            description: 'The retention period, in milliseconds, used to apply locks

              on new objects if none is specified by the S3 client.

              Valid values are any multiple of `86400000` (1 day), up to

              `3153600000000` (36500 days).

              If there is no default, this value is `null`.

              '
            type: integer
            format: int64
            example: 86400000
    BucketPatch:
      type: object
      properties:
        destroyed:
          description: 'Is the bucket destroyed?

            '
          type: boolean
        eradication_config:
          $ref: '#/components/schemas/_bucketEradicationConfig'
        hard_limit_enabled:
          description: 'If set to `true`, the bucket''s size, as defined by `quota_limit`,

            is used as a hard limit quota.

            If set to `false`, a hard limit quota will not be applied to the

            bucket, but soft quota alerts will still be sent if the bucket has

            a value set for `quota_limit`.

            '
          type: boolean
        object_lock_config:
          $ref: '#/components/schemas/_objectLockConfigRequestBody'
        public_access_config:
          $ref: '#/components/schemas/_publicAccessConfig'
        qos_policy:
          description: 'The QoS policy for the bucket defines the performance controls

            that can be applied to the aggregate performance of all the clients

            accessing the bucket.

            If no policy is set here, no explicit performance controls are applied

            to the bucket beyond the system''s default fairness.

            '
          title: ReferenceWritable
          allOf:
          - $ref: '#/components/schemas/_referenceWritable'
        quota_limit:
          description: 'The effective quota limit applied against the size of the bucket, displayed in bytes.

            If set to an empty string (`""`), the bucket is unlimited in size.

            '
          type: string
        retention_lock:
          description: 'If set to `ratcheted`, then `object_lock_config.default_retention_mode`

            cannot be changed if set to `compliance`. In this case, the value of

            `object_lock_config.default_retention` can only be increased and

            `object_lock_config.default_retention_mode` cannot be changed once set

            to `compliance`.

            Valid values are `unlocked` and `ratcheted`.

            Contact Pure Technical Services to change `ratcheted` to `unlocked`.

            '
          type: string
          example: unlocked
