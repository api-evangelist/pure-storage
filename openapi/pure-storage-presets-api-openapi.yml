          type: string
        total_item_count:
          description: Total number of items after applying `filter` params.
          type: integer
          format: int32
  parameters:
    Preset_workload_skip_verify_deployable:
      name: skip_verify_deployable
      in: query
      description: 'If set to `true`, only the most basic syntax checks are performed on the preset to ensure it

        is valid, but it is possible that it includes configuration that no array in the current fleet

        can honor when creating a workload. This is primarily useful when uploading a preset created

        elsewhere so it can be edited until it is deployable.

        If set to `false`, when a workload preset is created or updated, arrays in the fleet are queried

        to ensure at least one array in the fleet can deploy a workload based on the configuration

        specified in the preset.

        Defaults to `false`.

        '
      schema:
        type: boolean
    Context_names:
