openapi: 3.2.0
info:
  title: Pure Storage Administrators API
  x-refined-note:
  - x-logo differs across the merged source definitions and was not carried
  - x-pure-description-ref differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Administrators across 2 of this provider''s published API definitions: flasharray-rest-api-openapi.yml, flashblade-rest-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /
- url: http://[array]/
- url: https://[array]/
tags:
- name: Administrators
  description: 'The FlashArray has a single default administrative account named pureuser. The administrator can

    add, delete, and modify administrators on the array. Administrators are assigned management

    access policies to give different levels of permissions.'
paths:
