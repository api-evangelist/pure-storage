      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Total_item_count'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGetResponse'
      operationId: getApi252Admins
      x-operation-id-source: derived
    post:
      tags:
      - Administrators
