    ProtectionGroup:
      allOf:
      - $ref: '#/components/schemas/_context'
      - $ref: '#/components/schemas/_resource'
      - description: 'A protection group defines a set of either volumes, hosts, or host groups

          (called members) that are protected together through snapshots with

          point-in-time consistency across the member volumes. The members within the

          protection group have common data protection requirements and share the

          same snapshot, replication, and retention schedules.

          '
        type: object
        properties:
          destroyed:
            description: 'Has this protection group been destroyed?

              To destroy a protection group, patch to `true`.

              To recover a destroyed protection group, patch to `false`.

              If not specified, defaults to `false`.

              '
            type: boolean
          eradication_config:
            $ref: '#/components/schemas/ProtectionGroupEradicationConfig'
          host_count:
            description: Number of hosts in this protection group.
            type: integer
            format: int64
            readOnly: true
            example: 3
          host_group_count:
            description: Number of host groups in this protection group.
            type: integer
            format: int64
            readOnly: true
            example: 3
          is_local:
            description: 'If set to `true`, the protection group belongs to the local array.

              If set to `false`, the protection group belongs to the remote array.

              '
            type: boolean
            readOnly: true
          pod:
            description: The pod in which the protection group resides.
            title: FixedReference
            allOf:
            - $ref: '#/components/schemas/_fixedReference'
          replication_schedule:
            description: The schedule settings for asynchronous replication.
            title: Replication_schedule
            allOf:
            - $ref: '#/components/schemas/_replication_schedule'
          retention_lock:
            description: 'The valid values are `ratcheted` and `unlocked`.

              The default value for a newly created protection group is `unlocked`.

              Set `retention_lock` to `ratcheted` to enable SafeMode restrictions on the protection group.

              Contact Pure Technical Services to change `retention_lock` to `unlocked`.

              '
            type: string
            example: unlocked
          snapshot_schedule:
            description: The schedule settings for protection group snapshots.
            title: Snapshot_schedule
            allOf:
            - $ref: '#/components/schemas/_snapshot_schedule'
          source:
            description: The array or pod on which the protection group was created.
            title: FixedReference
            allOf:
            - $ref: '#/components/schemas/_fixedReference'
          source_retention:
            description: 'The retention policy for the source array of the protection group.

              '
            title: RetentionPolicy
            allOf:
            - $ref: '#/components/schemas/_retentionPolicy'
          space:
            description: 'Displays provisioned size and physical storage consumption data

              for each protection group.

              '
            title: Space
            allOf:
            - $ref: '#/components/schemas/_space'
          target_count:
            description: The number of targets to where this protection group replicates.
            type: integer
            format: int64
            readOnly: true
            example: 3
          target_retention:
            description: 'The retention policy for the target(s) of the protection group.

              '
            title: RetentionPolicy
            allOf:
            - $ref: '#/components/schemas/_retentionPolicy'
          time_remaining:
            description: 'The amount of time left until the destroyed protection group is permanently eradicated.

              Measured in milliseconds.

              Before the `time_remaining` period has elapsed, the destroyed protection group

              can be recovered by setting `destroyed=false`.

