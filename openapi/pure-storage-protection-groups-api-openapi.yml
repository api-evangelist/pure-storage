            type: integer
            format: int64
            readOnly: true
          volume_count:
            description: The number of volumes in the protection group.
            type: integer
            format: int64
            readOnly: true
            example: 3
          workload:
            $ref: '#/components/schemas/_workloadConfigurationFixedReference'
