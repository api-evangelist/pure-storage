  parameters:
    Protection_group_source_ids:
      name: source_ids
      in: query
      description: 'The id of the protection group or protection group snapshot to be copied

        into a new or existing protection group. If the destination protection group

        and all of its volumes already exist, include the `overwrite` parameter to

        overwrite all of the existing volumes with the snapshot contents.

        If including the `overwrite` parameter, the names of the volumes that are

        being overwritten must match the names of the volumes that are being restored.

        If the source is a protection group, the latest snapshot of the protection group

        will be used as the source during the copy operation.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Resource_names:
      name: resource_names
      in: query
      description: 'A comma-separated list of resource names.

        The `resource_ids` or `resource_names` parameter is required, but they cannot be set together.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    History_start_time:
      name: start_time
      in: query
      description: 'Displays historical performance data for the specified time window,

        where `start_time` is the beginning of the time window,

        and `end_time` is the end of the time window.

        The `start_time` and `end_time` parameters

        are specified in milliseconds since the UNIX epoch.

        If `start_time` is not specified,

        the start time will default to one resolution before the end time,

        meaning that the most recent sample of performance data will be displayed.

        If `end_time`is not specified, the end time will default to the current time.

        Include the `resolution` parameter to display the performance data at the specified resolution.

        If not specified, `resolution` defaults to the lowest valid resolution.


        '
      schema:
        type: integer
        format: int64
    Ids:
      name: ids
      in: query
      description: "A comma-separated list of unique resource IDs. At least one resource must match\n each specified ID, otherwise an error is returned. This parameter is required\n  if ids or names is not provided, but it cannot be used together with name or names.\n"
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Group_names:
      name: group_names
      in: query
      description: 'Performs the operation on the unique group name specified.

        Examples of groups include host groups, pods, protection groups, and volume groups.

        Enter multiple names in comma-separated format. For example, `hgroup01,hgroup02`.


        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Sort:
      name: sort
      in: query
      description: "Sorts the response objects by the specified fields. Sorting can be applied to any field name\n in the response, in ascending order by default, or in descending order by prefixing the\n field name with a minus sign (-). Multiple fields can be specified as a comma-separated\n list (e.g., sort volumes by size descending, then by name ascending). If sort is provided,\n the response will not include a continuation_token.\n"
      style: form
      explode: false
      schema:
        type: array
        items:
          pattern: ^[a-z]+(_[a-z]+)*-?
          type: string
    Allow_errors:
      name: allow_errors
      in: query
      description: 'If set to `true`, the API will allow the operation to continue even if there are errors.

        Any errors will be returned in the `errors` field of the response.

        If set to `false`, the operation will fail if there are any errors.

        '
      schema:
        type: boolean
        default: false
    Continuation_token:
      name: continuation_token
      in: query
      description: 'A token used to retrieve the next page of data

        with some consistency guaranteed.

        The token is a Base64 encoded value.

        Set `continuation_token` to the system-generated token taken from the `x-next-token`

        header field of the response.

        A query has reached its last page when the response does not include a token.

        Pagination requires the `limit` and `continuation_token`

        query parameters.

        '
      schema:
        type: string
    XRequestId:
      name: X-Request-ID
      in: header
      description: 'Supplied by client during request or generated by server.

        '
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: 'Limits the size of the response to the specified number of objects on each page.

        To return the total number of resources, set `limit=0`.

        The total number of resources is returned as a `total_item_count` value.

        If the page size requested is larger than the system maximum limit,

        the server returns the maximum limit, disregarding the requested page size.

        '
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 10
    Member_destroyed:
      name: member_destroyed
      in: query
      description: 'If true, returns only destroyed member objects. Returns an error if

        a name of a live member object is specified in the member_names query param.

        If false, returns only live member objects. Returns an error if

        a name of a destroyed member object is specified in the member_names

        query param.

        '
      schema:
        type: boolean
    Namespaces_delete:
      name: namespaces
      in: query
      description: 'A comma-separated list of namespaces. Only one namespace is allowed per delete request.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Member_names:
      name: member_names
      in: query
      description: 'Performs the operation on the unique member name specified.

        Examples of members include volumes, hosts, host groups, and directories.

        Enter multiple names in comma-separated format. For example, `vol01,vol02`.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Group_ids:
      name: group_ids
      in: query
      description: 'A comma-separated list of group IDs.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Total_only:
      name: total_only
      in: query
      description: 'If set to `true`, returns the aggregate value of all items after filtering.

        Where it makes more sense, the average value is displayed instead.

        The values are displayed for each name where meaningful.

        If `total_only=true`, the `items` list will be empty.

        '
      schema:
        type: boolean
    Filter:
      name: filter
      in: query
      description: 'Narrows down the results to only the response objects

        that satisfy the filter criteria.

        '
      schema:
        type: string
    Offset:
      name: offset
      in: query
      description: 'The starting position based on the results of the query

        in relation to the full set of response objects returned.

        '
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 10
    Protection_group_source_names:
      name: source_names
      in: query
      description: 'The name of the protection group or protection group snapshot to be copied

        into a new or existing protection group. If the destination protection group

        and all of its volumes already exist, include the `overwrite` parameter to

        overwrite all of the existing volumes with the snapshot contents.

        If including the `overwrite` parameter, the names of the volumes that are

        being overwritten must match the names of the volumes that are being restored.

        If the source is a protection group, the latest snapshot of the protection group

        will be used as the source during the copy operation.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    History_end_time:
      name: end_time
      in: query
      description: 'Displays historical performance data for the specified time window,

        where `start_time` is the beginning of the time window,

        and `end_time` is the end of the time window.

        The `start_time` and `end_time` parameters

        are specified in milliseconds since the UNIX epoch.

        If `start_time` is not specified,

        the start time will default to one resolution before the end time,

        meaning that the most recent sample of performance data will be displayed.

        If `end_time`is not specified, the end time will default to the current time.

        Include the `resolution` parameter to display the performance data at the specified resolution.

        If not specified, `resolution` defaults to the lowest valid resolution.


        '
      schema:
        type: integer
        format: int64
    Context_names:
      name: context_names
      in: query
      description: 'Performs the operation on the context specified.


        If specified, the context names must be an array of size 1, and the single element

        must be the name of an array in the same fleet or the name of the fleet itself. If

        not specified, the context will default to the array that received this request.


        Other parameters provided with the request, such as names of volumes or snapshots,

        are resolved relative to the provided `context`.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Namespaces:
      name: namespaces
      in: query
      description: 'A comma-separated list of namespaces.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Resource_destroyed:
      name: resource_destroyed
      in: query
      description: 'If set to `true`, returns only objects from destroyed resources. Returns an error if

        the name of a live resource is specified in the `resource_names` query parameter.

        If set to `false`, returns only objects from live resources. Returns an error if the

        name of a destroyed resource is specified in the `resource_names` query parameter.

        '
      schema:
        type: boolean
    Authorization:
      name: Authorization
      in: header
      description: 'Access token (in JWT format) required to use any API

        endpoint (except `/oauth2`, `/login`, and `/logout`)

        '
      schema:
        type: string
    Member_ids:
      name: member_ids
      in: query
      description: 'Performs the operation on the unique member IDs specified.

        Enter multiple member IDs in comma-separated format.

        The `member_ids` or `member_names` parameter is required, but they cannot be set together.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Total_item_count:
      name: total_item_count
      in: query
      description: 'If set to `true`, the `total_item_count` matching the

        specified query parameters is calculated and returned in

        the response. If set to `false`, the `total_item_count`

        is `null` in the response. This may speed up queries

        where the `total_item_count` is large. If not specified,

        defaults to `false`.

        '
      schema:
        type: boolean
    Keys:
      name: keys
      in: query
      description: 'A comma-separated list of tag keys.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    History_resolution:
      name: resolution
      in: query
      description: 'The number of milliseconds between samples of historical data.

        For array-wide performance metrics (`/arrays/performance` endpoint),

        valid values are `1000` (1 second), `30000` (30 seconds), `300000` (5 minutes),

        `1800000` (30 minutes), `7200000` (2 hours), `28800000` (8 hours), and `86400000` (24 hours).

        For performance metrics on storage objects (`<object name>/performance` endpoint),

        such as volumes,

        valid values are `30000` (30 seconds), `300000` (5 minutes), `1800000` (30 minutes),

        `7200000` (2 hours), `28800000` (8 hours), and `86400000` (24 hours).

        For space metrics, (`<object name>/space` endpoint),

        valid values are `300000` (5 minutes), `1800000` (30 minutes), `7200000` (2 hours),

        `28800000` (8 hours), and `86400000` (24 hours).

        Include the `start_time` parameter to display the performance data

        starting at the specified start time.

        If `start_time` is not specified,

        the start time will default to one resolution before the end time,

        meaning that the most recent sample of performance data will be displayed.

        Include the `end_time` parameter to display the performance data until the specified end time.

        If `end_time`is not specified, the end time will default to the current time.

        If the `resolution` parameter is not specified

        but either the `start_time` or `end_time` parameter is,

        then `resolution` will default to the lowest valid resolution.

        '
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 30000
    Overwrite:
      name: overwrite
      in: query
      description: 'If set to `true`,

        overwrites an existing object during an object copy operation.

        If set to `false` or not set at all and the target name is an existing object,

        the copy operation fails.

        Required if the `source` body parameter is set

        and the source overwrites an existing object during the copy operation.

        '
      schema:
        type: boolean
    Resource_ids:
      name: resource_ids
      in: query
      description: 'A comma-separated list of resource IDs.

        The `resource_ids` or `resource_names` parameter is required, but they cannot be set together.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Include_remote:
      name: include_remote
      in: query
      description: 'If set to `true` the response will include remote membership for protection groups that belong

        to the remote arrays or realms as well as local volumes.

        Defaults to `false`.

        '
      schema:
        type: boolean
    Pgroup_group_ids:
      name: group_ids
      in: query
      description: 'Performs the operation on the unique group id specified.

        Provide multiple resource IDs in comma-separated format.

        The group_ids or names parameter is required, but they cannot be set together.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Names:
      name: names
      in: query
      description: 'Performs the operation on the unique names specified.

        Enter multiple names in comma-separated format.

        For example, `name01,name02`.


        If there is not at least one resource that matches

        each of the elements of `names`, then an error is returned,

        except when creating new resources.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Context_names_get:
      name: context_names
      in: query
      description: 'Performs the operation on the unique contexts specified.


        If specified, each context name must be the name of an array in the same fleet or

        the name of the fleet itself.


        If not specified, the context will default to the array that received this request.


        Other parameters provided with the request, such as names of volumes or snapshots,

        are resolved relative to the provided `context`.


        Enter multiple names in comma-separated format.

        For example, `name01,name02`.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Destroyed:
      name: destroyed
      in: query
      description: 'If set to `true`, lists only destroyed objects that are in the eradication pending state.

        If set to `false`, lists only objects that are not destroyed.

        If not set, lists both objects that are destroyed and those that are not destroyed.


        For destroyed objects, the time remaining is displayed in milliseconds.


        If object name(s) or id(s) are specified, then each object referenced must exist.

        If `destroyed` is set to `true`, then each object referenced must also be destroyed.

        If `destroyed` is set to `false`, then each object referenced must also not be destroyed.

        An error is returned if any of these conditions are not met.

        '
      schema:
        type: boolean
