    _retentionPolicy:
      description: The snapshot retention policy.
      type: object
      properties:
        all_for_sec:
          description: 'The length of time to keep the specified snapshots. Measured in seconds.

            Prior to 6.8.2 the range of 60 to 34560000 is accepted.

            In 6.8.2 and onwards the range of 60 to 2147483647 is accepted.

            '
          type: integer
          format: int32
          example: 86400
        days:
          description: 'The number of days to keep the snapshots after the `all_for_sec` period has passed.

            Prior to 6.6.4 the range of 0 to 4000 is accepted.

            In 6.6.4 and onwards the range of 0 to 2147483647 is accepted.

            In 6.10.0 and onwards -1 may be used to keep snapshots forever.

            '
          type: integer
          format: int32
          example: 7
        per_day:
          description: 'Deprecated. per_day is deprecated in favor of per_period and period_length_ms.

            The number of snapshots to keep per day after the `all_for_sec` period has passed.

            Prior to 6.8.2 the range of 0 to 1440 is accepted.

            In 6.8.2 and onwards the range of 0 to 2147483647 is accepted.

            Equivalent to per_period when period_length_ms is 1 day, 86400000

            '
          type: integer
          format: int32
          example: 3
        per_period:
          description: 'The number of snapshots to keep per period_length_ms after the `all_for_sec` period has passed.

            The range of 0 to 2147483647 is accepted.

            '
          type: integer
          format: int32
          example: 3
        period_length_ms:
          description: 'The length of time per_period should cover. Measured in milliseconds.

            Must be a multiple of 86400000 to represent a whole number of days.

            A minimum of 86400000, 1 day, is accepted.

            '
          type: integer
          format: int64
          example: 86400000
    _builtIn:
      description: 'A built-in resource. Many are singletons predefined by Purity (e.g., support

        settings). Some correspond to a piece of software, like an app, or hardware,

        like a controller. Others are created by the system in response to some event

        (e.g., alerts, audit records).


        Typically, a user can''t create, delete or rename a built-in resource. A few

        can be created or deleted, but not renamed because the names are meaningful

        to Purity (e.g., VIFs).

        '
      type: object
      properties:
        id:
          description: 'A globally unique, system-generated ID.

            The ID cannot be modified and cannot refer to another resource.

