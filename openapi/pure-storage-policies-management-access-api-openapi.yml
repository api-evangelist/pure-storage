openapi: 3.0.1
info:
  title: FlashArray REST Active Directory Policies - Management Access API
  version: '2.52'
  description: 'Active Directory configuration authenticates users for NFS using Kerberos or SMB using Kerberos

    or New Technology LAN Manager (NTLM). Active Directory is also used to authorize users by

    mapping identities across the NFS and SMB protocols by using LDAP queries.

    '
servers:
- url: /
tags:
- name: Policies - Management Access
  description: Manages management access policies. These policies are composed of rules which govern an administrative user's permissions when managing resources.
