          description: 'The average time it takes the array to process a mirrored I/O write request,

            measured in microseconds.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        qos_rate_limit_usec_per_read_op:
          description: 'The average time spent waiting due to QoS rate limiting for a read request,

            measured in microseconds.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        qos_rate_limit_usec_per_write_op:
          description: 'The average time that a write I/O request spends waiting

            as a result of the volume reaching its QoS bandwidth limit,

            measured in microseconds.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        qos_scheduling_usec_per_mirrored_write_op:
          description: 'The average time that a mirrored write I/O gets delayed due to QoS scheduling,

            measured in microseconds.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        qos_scheduling_usec_per_read_op:
          description: 'The average time that a read I/O gets delayed due to QoS scheduling,

            measured in microseconds.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        qos_scheduling_usec_per_write_op:
          description: 'The average time that a write I/O gets delayed due to QoS scheduling,

            measured in microseconds.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        queue_usec_per_mirrored_write_op:
          description: 'The average time that a mirrored write I/O request spends in the kernel waiting to be served,

            measured in microseconds.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        queue_usec_per_read_op:
          description: 'The average time that a read I/O request spends in the kernel waiting to be served,

            measured in microseconds.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        queue_usec_per_write_op:
          description: 'The average time that a write I/O request spends in the kernel waiting to be served,

            measured in microseconds.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        read_bytes_per_sec:
          description: 'The number of bytes read per second.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        read_cache_hit_ratio:
          description: The ratio of read requests served directly from the cache.
          type: number
          format: float
          minimum: 0
          maximum: 1
          readOnly: true
        reads_per_sec:
          description: 'The number of read requests processed per second.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        san_usec_per_mirrored_write_op:
          description: 'The average time required to transfer data

            from the initiator to the array for a mirrored write request,

            measured in microseconds.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        san_usec_per_read_op:
          description: 'The average time required to transfer data from the array

            to the initiator for a read request, measured in microseconds.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        san_usec_per_write_op:
          description: 'The average time required to transfer data

            from the initiator to the array for a write request,

            measured in microseconds.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        service_usec_per_mirrored_write_op:
          description: 'The average time required for the array to service a mirrored write request,

            measured in microseconds.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        service_usec_per_read_op:
          description: 'The average time required for the array to service a read request,

            measured in microseconds.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        service_usec_per_read_op_cache_reduction:
          description: 'The percentage reduction in `service_usec_per_read_op` due to data cache

            hits. For example, a value of 0.25 indicates that the value of

            `service_usec_per_read_op` is 25&#37; lower than it would have been without

            any data cache hits.

            '
          type: number
          format: float
          minimum: 0
          maximum: 1
        service_usec_per_read_op_cached:
          description: 'The average time required for the array to service a read request that is satisfied by a cache

            hit, measured in microseconds.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        service_usec_per_read_op_non_cached:
          description: 'The average time required for the array to service a read request that is not satisfied by a

            cache hit, measured in microseconds.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        service_usec_per_write_op:
          description: 'The average time required for the array to service a write request,

            measured in microseconds.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        time:
          description: 'The time when the sample performance data was taken,

            measured in milliseconds since the UNIX epoch.

            '
          type: integer
          format: int64
          readOnly: true
        usec_per_mirrored_write_op:
          description: 'The average time it takes the array to process a mirrored I/O write request,

            measured in microseconds.

            Beginning in Purity 6.3.14 and 6.4.10 and later,

            including later major versions (6.5.x, 6.6.x and beyond),

            queue time is included.

            The average time does not include SAN time or QoS rate limit time.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        usec_per_read_op:
          description: 'The average time it takes the array to process an I/O read request,

            measured in microseconds.

            Beginning in Purity 6.3.14 and 6.4.10 and later,

            including later major versions (6.5.x, 6.6.x and beyond),

            queue time is included.

            The average time does not include SAN time or QoS rate limit time.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        usec_per_write_op:
          description: 'The average time it takes the array to process an I/O write request,

            measured in microseconds.

            Beginning in Purity 6.3.14 and 6.4.10 and later,

            including later major versions (6.5.x, 6.6.x and beyond),

            queue time is included.

            The average time does not include SAN time or QoS rate limit time.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        write_bytes_per_sec:
          description: The number of bytes written per second.
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        writes_per_sec:
          description: The number of write requests processed per second.
          type: integer
          format: int64
          minimum: 0
          readOnly: true
      x-readOnly: true
    RealmDefaultsResponse:
      type: object
      properties:
        items:
          description: A list of realm default configurations.
          type: array
          items:
            $ref: '#/components/schemas/RealmDefaults'
    RealmResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Realm'
    _spaceNoDeprecatedPhysicalOrEffective:
      type: object
      properties:
        data_reduction:
          description: 'The ratio of mapped sectors within a volume versus

            the amount of physical space the data occupies after data compression and deduplication.

            The data reduction ratio does not include thin provisioning savings.

            For example, a data reduction ratio of 5:1 means that

            for every 5 MB the host writes to the array, 1 MB is stored on the array''s flash modules.

            '
          type: number
          format: float
        footprint:
          description: 'The maximum amount of physical space the container would take up on any array,

            ignoring any data shared outside the container.

            Measured in bytes.

            On Evergreen//One arrays, this is the maximum amount of effective used space,

            measured in bytes.

            The footprint metric is mostly used for capacity planning.

            This field will be null in non-container contexts.

            '
          type: integer
          format: int64
          minimum: 0
        shared:
          description: 'The physical space occupied by deduplicated data,

            meaning that the space is shared with other volumes and snapshots

            as a result of data deduplication, measured in bytes.

            On Evergreen//One arrays, this is the effective space contributed by data that is not unique

            to a specific volume, managed directory, or snapshot, measured in bytes.

            '
          type: integer
          format: int64
          minimum: 0
          example: 111863360624
        snapshots:
          description: 'The physical space occupied by data unique to one or more snapshots, measured in bytes.

            On Evergreen//One arrays, this is the effective space contributed by data unique to one or

            more snapshots, measured in bytes.

            '
          type: integer
          format: int64
          minimum: 0
        system:
          description: 'The physical space occupied by internal array metadata, measured in bytes.

            '
          type: integer
          format: int64
          minimum: 0
        thin_provisioning:
          description: 'The percentage of volume sectors that do not contain host-written data

            because the hosts have not written data to them or the sectors have been explicitly trimmed.

            '
          type: number
          format: float
          minimum: 0
          maximum: 1
        total_provisioned:
          description: 'The provisioned size of a volume for a single volume, host or host group,

            protocol endpoint, managed directory, and containers can be infinite or measured in bytes.

            Infinite is represented by `null`.

            The provisioned size for a host or host group, includes all volumes

            that are connected to the resource.

            The provisioned size for a protocol endpoint is `null`.

            The provisioned size for a managed directory is the quota limit if it

            or its parent has a managed directory configured, otherwise it defaults to `null`.

            The provisioned size for a container is the sum of the total_provisioned

            of the object it contains, capped by the container''s quota limit

            (or the container''s used_provisioned if current usage is above the quota limit), if any.

            Provisioned size represents the storage capacity reported to hosts.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          example: 19937690345472
        total_reduction:
          description: 'The ratio of provisioned sectors within a volume versus the amount of physical space

            the data occupies after reduction via data compression and deduplication

            and with thin provisioning savings.

            Total reduction is data reduction with thin provisioning savings.

            For example, a total reduction ratio of 10&#58;1 means that

            for every 10 MB of provisioned space, 1 MB is stored on the array''s flash modules.

            '
          type: number
          format: float
        total_used:
          description: 'The total space contributed by customer data, measured in bytes.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        unique:
          description: 'The unique physical space occupied by customer data.

            Unique physical space does not include shared space, snapshots, and internal array metadata.

            Measured in bytes.

            On Evergreen//One arrays, this is the effective space contributed by unique customer data,

            measured in bytes.

            Unique data does not include shared space, snapshots, and internal array metadata.

            '
          type: integer
          format: int64
          minimum: 0
        used_provisioned:
          description: 'The amount of logical space a container has consumed.

            The amount of logical space is compared against the quota limit

            if the container has one configured.

            Used provisioned does not include destroyed objects inside the container.

            For a destroyed container, used provisioned can include destroyed objects

            and represents how much logical space it would take to recover the container.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          example: 19937690345472
        virtual:
          description: 'The amount of logically written data that a volume or a snapshot references,

            measured in bytes.

            '
          type: integer
          format: int64
          minimum: 0
    _containerQosCeilings_patch:
      type: object
      properties:
        bandwidth_limit:
          description: 'The maximum QoS bandwidth limit for the container, measured in `bytes per second`.

            Throttling occurs when throughput exceeds this limit. The maximum supported limit

            is `512 GB/s`. Specifying an empty string `""` unsets the limit.

            '
          title: ContainerQosCeilingsBandwidthLimitPatch
          oneOf:
          - $ref: '#/components/schemas/_qos_bw_limit_type'
          - $ref: '#/components/schemas/_limit_unset_value'
        iops_limit:
          description: 'The QoS `IOPS` limit for the container.

            Specifying an empty string `""` unsets the limit.

            '
          title: ContainerQosCeilingsIopsLimitPatch
          oneOf:
          - $ref: '#/components/schemas/_qos_iops_limit_type'
          - $ref: '#/components/schemas/_limit_unset_value'
    ContainerPerformance:
      allOf:
      - $ref: '#/components/schemas/_performance'
      - $ref: '#/components/schemas/_performance_others'
      - $ref: '#/components/schemas/_resource'
      - $ref: '#/components/schemas/_context'
    _fixedReference:
      type: object
      properties:
        id:
          description: 'A globally unique, system-generated ID.

            The ID cannot be modified.

            '
          type: string
          readOnly: true
        name:
          description: 'The resource name, such as volume name, file system name,

            snapshot name, and so on.

            '
          type: string
          readOnly: true
      x-readOnly: true
      x-aliases:
      - _fixedReferenceWithoutType
  parameters:
    Resource_names:
      name: resource_names
      in: query
      description: 'A comma-separated list of resource names.

        The `resource_ids` or `resource_names` parameter is required, but they cannot be set together.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Offset_2:
      name: offset
      in: query
      description: 'The offset of the first resource to return from a collection.

        '
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 10
    History_start_time:
      name: start_time
      in: query
      description: 'Displays historical performance data for the specified time window,

        where `start_time` is the beginning of the time window,

        and `end_time` is the end of the time window.

        The `start_time` and `end_time` parameters

        are specified in milliseconds since the UNIX epoch.

        If `start_time` is not specified,

        the start time will default to one resolution before the end time,

        meaning that the most recent sample of performance data will be displayed.

        If `end_time`is not specified, the end time will default to the current time.

        Include the `resolution` parameter to display the performance data at the specified resolution.

        If not specified, `resolution` defaults to the lowest valid resolution.


        '
      schema:
        type: integer
        format: int64
    Without_default_access_list:
      name: without_default_access_list
      in: query
      description: 'Specifying this option ensures a realm is created without any resource accesses.

        '
      required: true
      schema:
        type: boolean
    Ids:
      name: ids
      in: query
      description: "A comma-separated list of unique resource IDs. At least one resource must match\n each specified ID, otherwise an error is returned. This parameter is required\n  if ids or names is not provided, but it cannot be used together with name or names.\n"
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Realm_names:
      name: realm_names
      in: query
      description: 'A comma-separated list of realm names. If there is not

        at least one resource that matches each of the elements, then an error

        is returned. This cannot be provided together with `realm_ids`

        query parameter.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Sort:
      name: sort
      in: query
      description: "Sorts the response objects by the specified fields. Sorting can be applied to any field name\n in the response, in ascending order by default, or in descending order by prefixing the\n field name with a minus sign (-). Multiple fields can be specified as a comma-separated\n list (e.g., sort volumes by size descending, then by name ascending). If sort is provided,\n the response will not include a continuation_token.\n"
      style: form
      explode: false
      schema:
        type: array
        items:
          pattern: ^[a-z]+(_[a-z]+)*-?
          type: string
    Allow_errors:
      name: allow_errors
      in: query
      description: 'If set to `true`, the API will allow the operation to continue even if there are errors.

        Any errors will be returned in the `errors` field of the response.

        If set to `false`, the operation will fail if there are any errors.

        '
      schema:
        type: boolean
        default: false
    Container_ignore_usage:
      name: ignore_usage
      in: query
      description: 'Set to `true` to set a `quota_limit` that is lower than the existing usage.

        This ensures that no new volumes can be created until the existing usage

        drops below the `quota_limit`.

        If not specified, defaults to `false`.

        '
      schema:
        type: boolean
    Continuation_token:
      name: continuation_token
      in: query
      description: 'A token used to retrieve the next page of data

        with some consistency guaranteed.

        The token is a Base64 encoded value.

        Set `continuation_token` to the system-generated token taken from the `x-next-token`

        header field of the response.

        A query has reached its last page when the response does not include a token.

        Pagination requires the `limit` and `continuation_token`

        query parameters.

        '
      schema:
        type: string
    XRequestId:
      name: X-Request-ID
      in: header
      description: 'Supplied by client during request or generated by server.

        '
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: 'Limits the size of the response to the specified number of objects on each page.

        To return the total number of resources, set `limit=0`.

        The total number of resources is returned as a `total_item_count` value.

        If the page size requested is larger than the system maximum limit,

        the server returns the maximum limit, disregarding the requested page size.

        '
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 10
    Namespaces_delete:
      name: namespaces
      in: query
      description: 'A comma-separated list of namespaces. Only one namespace is allowed per delete request.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Sort_2:
      name: sort
      in: query
      description: 'Sort the response by the specified fields (in descending order if ''-''

        is appended to the field name).

        NOTE: If you provide a sort you will not get a `continuation_token` in

        the response.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          pattern: ^[a-z]+(_[a-z]+)*-?
          type: string
    Destroy_contents:
      name: destroy_contents
      in: query
      description: 'Set to `true` to destroy contents (e.g., volumes, protection groups, snapshots) and containers

        (e.g., realms, pods, volume groups), including eradicating containers with content.

        '
      schema:
        type: boolean
    Ids_2:
      name: ids
      in: query
      description: 'A comma-separated list of resource IDs.

        If after filtering, there is not at least one resource that matches

        each of the elements of `ids`, then an error is returned.

        This cannot be provided together with the `name` or `names` query parameters.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Names_required:
      name: names
      in: query
      description: 'Performs the operation on the unique name specified.

        For example, `name01`.

        Enter multiple names in comma-separated format.

        '
      required: true
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Resolution:
      name: resolution
      in: query
      description: 'The desired ms between samples. Available resolutions may

        depend on data type, `start_time` and `end_time`.

        In general `1000`, `30000`, `300000`, `1800000`, `7200000`, and

        `86400000` are possible values.

        '
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 30000
    Total_only:
      name: total_only
      in: query
      description: 'If set to `true`, returns the aggregate value of all items after filtering.

        Where it makes more sense, the average value is displayed instead.

        The values are displayed for each name where meaningful.

        If `total_only=true`, the `items` list will be empty.

        '
      schema:
        type: boolean
    Filter:
      name: filter
      in: query
      description: 'Narrows down the results to only the response objects

        that satisfy the filter criteria.

        '
      schema:
        type: string
    Offset:
      name: offset
      in: query
      description: 'The starting position based on the results of the query

        in relation to the full set of response objects returned.

        '
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 10
    Start_time:
      name: start_time
      in: query
      description: 'When the time window starts (in milliseconds since epoch).

        '
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 1514764800000
    History_end_time:
      name: end_time
      in: query
      description: 'Displays historical performance data for the specified time window,

        where `start_time` is the beginning of the time window,

        and `end_time` is the end of the time window.

        The `start_time` and `end_time` parameters

        are specified in milliseconds since the UNIX epoch.

        If `start_time` is not specified,

        the start time will default to one resolution before the end time,

        meaning that the most recent sample of performance data will be displayed.

        If `end_time`is not specified, the end time will default to the current time.

        Include the `resolution` parameter to display the performance data at the specified resolution.

        If not specified, `resolution` defaults to the lowest valid resolution.


        '
      schema:
        type: integer
        format: int64
    Context_names:
      name: context_names
      in: query
      description: 'Performs the operation on the context specified.


        If specified, the context names must be an array of size 1, and the single element

        must be the name of an array in the same fleet or the name of the fleet itself. If

        not specified, the context will default to the array that received this request.


        Other parameters provided with the request, such as names of volumes or snapshots,

        are resolved relative to the provided `context`.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Namespaces:
      name: namespaces
      in: query
      description: 'A comma-separated list of namespaces.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Resource_destroyed:
      name: resource_destroyed
      in: query
      description: 'If set to `true`, returns only objects from destroyed resources. Returns an error if

        the name of a live resource is specified in the `resource_names` query parameter.

        If set to `false`, returns only objects from live resources. Returns an error if the

        name of a destroyed resource is specified in the `resource_names` query parameter.

        '
      schema:
        type: boolean
    Authorization:
      name: Authorization
      in: header
      description: 'Access token (in JWT format) required to use any API

        endpoint (except `/oauth2`, `/login`, and `/logout`)

        '
      schema:
        type: string
    Total_item_count:
      name: total_item_count
      in: query
      description: 'If set to `true`, the `total_item_count` matching the

        specified query parameters is calculated and returned in

        the response. If set to `false`, the `total_item_count`

        is `null` in the response. This may speed up queries

        where the `total_item_count` is large. If not specified,

        defaults to `false`.

        '
      schema:
        type: boolean
    Realm_ids:
      name: realm_ids
      in: query
      description: 'A comma-separated list of realm IDs. If, after filtering,

        there is not at least one resource that matches each of the elements,

        then an error is returned. This cannot be provided together with the

        `realm_names` query parameter.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Keys:
      name: keys
      in: query
      description: 'A comma-separated list of tag keys.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Type:
      name: type
      in: query
      description: 'Display the metric of a specified object type.

        Valid values are `array`, `file-system`, and `object-store`.

        If not specified, defaults to `array`.

        '
      schema:
        type: string
    History_resolution:
      name: resolution
      in: query
      description: 'The number of milliseconds between samples of historical data.

        For array-wide performance metrics (`/arrays/performance` endpoint),

        valid values are `1000` (1 second), `30000` (30 seconds), `300000` (5 minutes),

        `1800000` (30 minutes), `7200000` (2 hours), `28800000` (8 hours), and `86400000` (24 hours).

        For performance metrics on storage objects (`<object name>/performance` endpoint),

        such as volumes,

        valid values are `30000` (30 seconds), `300000` (5 minutes), `1800000` (30 minutes),

        `7200000` (2 hours), `28800000` (8 hours), and `86400000` (24 hours).

        For space metrics, (`<object name>/space` endpoint),

        valid values are `300000` (5 minutes), `1800000` (30 minutes), `7200000` (2 hours),

        `28800000` (8 hours), and `86400000` (24 hours).

        Include the `start_time` parameter to display the performance data

        starting at the specified start time.

        If `start_time` is not specified,

        the start time will default to one resolution before the end time,

        meaning that the most recent sample of performance data will be displayed.

        Include the `end_time` parameter to display the performance data until the specified end time.

        If `end_time`is not specified, the end time will default to the current time.

        If the `resolution` parameter is not specified

        but either the `start_time` or `end_time` parameter is,

        then `resolution` will default to the lowest valid resolution.

        '
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 30000
    Names_required_2:
      name: names
      in: query
