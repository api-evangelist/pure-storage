components:
  schemas:
    _directoryServiceManagement:
      description: Properties specific to the management service.
      type: object
      properties:
        ssh_public_key_attribute:
          description: 'SSH public key attribute in the structure of the configured LDAP servers.

            The attribute field that holds the user''s SSH public key.

            This attribute can represent a single-valued or multi-valued field.

            If this attribute resolves to a multi-valued field, all valid SSH keys will be used.

            If the user has specified keys under Admin endpoints, these are used as well.

            '
          type: string
          example: sshPublicKey
        user_login_attribute:
          description: 'User login attribute in the structure of the configured LDAP servers.

            Typically the attribute field that holds the user''s unique login name.

            Default value is `sAMAccountName` for Active Directory or `uid` for all other

            directory services.

            '
          type: string
          example: email
        user_object_class:
          description: 'Value of the object class for a management LDAP user.

            Defaults to `User` for Active Directory servers, `posixAccount` or `shadowAccount` for

            OpenLDAP servers dependent on the group type of the server, or `person` for all other

            directory servers.

            '
          type: string
          example: inetOrgPerson
    LocalMembershipResponse:
      type: object
      properties:
        items:
          description: 'Displays a list of all items after filtering.

            The values are displayed for each name, if meaningful.

            '
          type: array
          items:
            $ref: '#/components/schemas/LocalMember'
    _errorcontextresponseErrors:
