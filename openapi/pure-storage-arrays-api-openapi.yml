      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - $ref: '#/components/schemas/EulaResponse'
    ArrayErasure:
      allOf:
      - $ref: '#/components/schemas/_resource'
      - description: 'Status and detailed information of the factory reset process.

          '
        type: object
        properties:
          details:
            description: 'The detailed reason of the `status`.

              '
            type: string
          image_download_progress:
            description: 'The progress of the ISO image download, displayed in decimal format.

              '
            type: number
            format: float
            example: 0.32
          image_source:
            description: 'Source of the ISO image to download. Valid values include `auto` and URLs.

              `auto` means download the image from Pure1 cloud,

              and a URL means download the image from the specified URL.

              '
            type: string
            example: auto
          image_version:
            description: 'Version of the image to download and install.

              '
            type: string
            example: 6.6.6
          sanitization_certificate:
            description: 'The sanitization certificate of the factory reset,

              which complies with the standard described in NIST SP800-88R1 section 4.8.

              '
            type: string
          status:
            description: 'The status of the factory reset process.

              Valid values include `resetting`, `reset_failed`, `reimage_failed`,

              `waiting_for_finalize`, `downloading`, `downloaded`, and `download_failed`.

              A status of `resetting` indicates that the factory reset is running.

              A status of `reset_failed` indicates that the factory reset encountered a failure.

              A status of `reimage_failed` indicates that the factory reset failed to reimage the array.

              A status of `waiting_for_finalize` indicates that the factory reset has finished

              sanitizing drives, and is waiting to be finalized.

              A status of `downloading` indicates that the factory reset is downloading ISO image.

              A status of `downloaded` indicates that the factory reset completed ISO image download.

              A status of `download_failed` indicates that the factory reset failed to download ISO image.

              '
            type: string
            example: resetting
    PageInfo:
      type: object
      properties:
        continuation_token:
          description: 'Continuation token that can be provided in the `continuation_token`

            query param to get the next page of data.

            If you use the continuation token to page through data you

            are guaranteed to get all items exactly once regardless of

            how items are modified. If an item is added or deleted during

            the pagination then it may or may not be returned.

            The continuation token is generated if the limit is less

            than the remaining number of items, and the default sort is used

            (no sort is specified).

            '
          type: string
        more_items_remaining:
          description: 'Returns a value of `true` if subsequent items can be retrieved.

            '
          type: boolean
          example: false
        total_item_count:
          description: 'The total number of records after applying all filter query parameters.

            The `total_item_count` will be calculated if and only if the corresponding

            query parameter `total_item_count` is set to `true`. If this query parameter

