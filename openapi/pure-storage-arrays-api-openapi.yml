components:
  schemas:
    ArrayEncryption:
      description: If the user does not have sufficient access, all fields will return `null`.
      type: object
      properties:
        data_at_rest:
          title: ArrayencryptionDataAtRest
          allOf:
          - $ref: '#/components/schemas/_arrayencryptionDataAtRest'
        module_version:
          description: 'The version of the Purity encryption module installed on the array.

            Security certifications are carried out on a per-version basis.

            On non-encrypt builds, an encryption module may be installed without

            being enabled.

            Values include `FA-1.0`, `FA-1.1`, `FA-1.2`, `FA-1.3`, and so on.

            '
          type: string
          readOnly: true
          example: FA-1.3
      x-readOnly: true
    ArraysSupportedTimeZonesGetResponse:
      allOf:
      - $ref: '#/components/schemas/PageInfo_2'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/_timeZone'
    _eula_signature:
      type: object
      properties:
        accepted:
          description: Accepted time in milliseconds since the UNIX epoch.
          type: integer
