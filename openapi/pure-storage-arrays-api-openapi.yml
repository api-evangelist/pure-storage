        specified query parameters is calculated and returned in

        the response. If set to `false`, the `total_item_count`

        is `null` in the response. This may speed up queries

        where the `total_item_count` is large. If not specified,

        defaults to `false`.

        '
      schema:
        type: boolean
    Preserve_configuration_data_required_2:
      name: preserve_configuration_data
      in: query
      required: true
      description: 'For the initial phase `none` is only acceptable value for this parameter

        '
      schema:
        type: string
        default: none
    Keys:
      name: keys
      in: query
      description: 'A comma-separated list of tag keys.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Type:
      name: type
      in: query
      description: 'Display the metric of a specified object type.

        Valid values are `array`, `file-system`, and `object-store`.

        If not specified, defaults to `array`.

        '
      schema:
        type: string
    History_resolution:
      name: resolution
      in: query
      description: 'The number of milliseconds between samples of historical data.

        For array-wide performance metrics (`/arrays/performance` endpoint),

        valid values are `1000` (1 second), `30000` (30 seconds), `300000` (5 minutes),

        `1800000` (30 minutes), `7200000` (2 hours), `28800000` (8 hours), and `86400000` (24 hours).

        For performance metrics on storage objects (`<object name>/performance` endpoint),

        such as volumes,

        valid values are `30000` (30 seconds), `300000` (5 minutes), `1800000` (30 minutes),

        `7200000` (2 hours), `28800000` (8 hours), and `86400000` (24 hours).

        For space metrics, (`<object name>/space` endpoint),

        valid values are `300000` (5 minutes), `1800000` (30 minutes), `7200000` (2 hours),

        `28800000` (8 hours), and `86400000` (24 hours).

        Include the `start_time` parameter to display the performance data

        starting at the specified start time.

        If `start_time` is not specified,

        the start time will default to one resolution before the end time,

        meaning that the most recent sample of performance data will be displayed.

        Include the `end_time` parameter to display the performance data until the specified end time.

        If `end_time`is not specified, the end time will default to the current time.

        If the `resolution` parameter is not specified

        but either the `start_time` or `end_time` parameter is,

        then `resolution` will default to the lowest valid resolution.

        '
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 30000
    Perf_protocol_group:
      name: protocol_group
      in: query
      description: 'Protocol group type. Valid values are `block`, `file`, `object-store`, and `all`.

        '
      schema:
        type: string
    Offset_3:
      name: offset
      in: query
      description: 'The offset of the first resource to return from a collection.

        '
      schema:
        type: integer
        format: int32
        minimum: 0
    Resource_ids:
      name: resource_ids
      in: query
      description: 'A comma-separated list of resource IDs.

        If there is not at least one resource that matches each `resource_id` element,

        an error is returned.

        Single quotes are required around all strings.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        x-quoted: true
      x-quoted: true
    Names_2:
      name: names
      in: query
      description: 'A comma-separated list of resource names.

        If there is not at least one resource that matches each `name` element,

        an error is returned.

        Single quotes are required around all strings.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        x-quoted: true
      x-quoted: true
    Names:
      name: names
      in: query
      description: 'Performs the operation on the unique names specified.

        Enter multiple names in comma-separated format.

        For example, `name01,name02`.


        If there is not at least one resource that matches

        each of the elements of `names`, then an error is returned,

        except when creating new resources.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Context_names_get:
      name: context_names
      in: query
      description: 'Performs the operation on the unique contexts specified.


        If specified, each context name must be the name of an array in the same fleet or

        the name of the fleet itself.


        If not specified, the context will default to the array that received this request.


        Other parameters provided with the request, such as names of volumes or snapshots,

        are resolved relative to the provided `context`.


        Enter multiple names in comma-separated format.

        For example, `name01,name02`.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    StorageClassNames:
      name: storage_class_names
      in: query
      description: 'A comma-separated list of storage class names. Valid values include `S500X-S` and `S500X-A`.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Resource_namesRequired:
      name: resource_names
      in: query
      description: 'REQUIRED: either `resource_ids` or `resource_names`.

        A comma-separated list of resource names.

        If there is not at least one resource that matches each `resource_name`

        element, an error is returned.

        Single quotes are required around all strings.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        x-quoted: true
      x-quoted: true
    End_time:
      name: end_time
      in: query
      description: 'When the time window ends (in milliseconds since epoch).

        '
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 1514764800000
    Finalize_array_erasure_required:
      name: finalize
      in: query
      description: 'Must be `true` to finalize factory reset.

        '
      required: true
      schema:
        type: boolean
    Type_for_performance:
      name: type
      in: query
      description: 'Display the metric of a specified object type.

        Valid values are `all`, `file-system`, and `object-store`.

        If not specified, defaults to `all`.

        '
      schema:
        type: string
    Protocol:
      name: protocol
      in: query
      description: 'Display the performance of a specified protocol.

        Valid values are `all`, `HTTP`, `SMB`, `NFS`, and `S3`.

        If not specified, defaults to `all`, which will provide

        the combined performance of all available protocols.

        '
      schema:
        type: string
    Eradicate_all_data_required_2:
      name: eradicate_all_data
      in: query
      required: true
      description: 'Set to `true` to perform a factory reset.

        '
      schema:
        type: boolean
        default: true
