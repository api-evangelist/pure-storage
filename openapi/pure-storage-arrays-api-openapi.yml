            and the default value is the current running Purity version.

            If `image_source` is `auto`, the image with the specified version

            will be downloaded from Pure1 cloud.

            If `image_source` is a URL, `image_version` will be used to compare

            to the downloaded image version for the purpose of validation.

            '
