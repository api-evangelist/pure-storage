      description: 'Used by ping and trace to specify where to run the operation. Valid values are controllers

        and blades from hardware list.

        If not specified, defaults to all available controllers and selected blades.

        '
      schema:
        type: string
    Names:
      name: names
      in: query
      description: 'Performs the operation on the unique names specified.

        Enter multiple names in comma-separated format.

        For example, `name01,name02`.


        If there is not at least one resource that matches

        each of the elements of `names`, then an error is returned,

        except when creating new resources.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Context_names_get:
      name: context_names
      in: query
      description: 'Performs the operation on the unique contexts specified.


        If specified, each context name must be the name of an array in the same fleet or

        the name of the fleet itself.


        If not specified, the context will default to the array that received this request.


        Other parameters provided with the request, such as names of volumes or snapshots,

        are resolved relative to the provided `context`.


        Enter multiple names in comma-separated format.

        For example, `name01,name02`.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    Ping_trace_destination:
      name: destination
      in: query
      description: 'A destination specified by user to run the network diagnosis against. Can be a hostname or an IP.

        '
      required: true
      schema:
        type: string
      example: www.test.com
    Fragment_packet:
      name: fragment_packet
      in: query
      description: 'Used by trace to specify whether or not to

        fragment packets. If not specified, defaults to true.

        '
      schema:
        type: boolean
    End_time:
      name: end_time
      in: query
      description: 'When the time window ends (in milliseconds since epoch).

        '
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 1514764800000
