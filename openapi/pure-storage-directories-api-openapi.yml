      summary: Pure Storage Create NLM Reclamation
      description: 'Creates an NLM reclamation, which is a system-wide operation that affects all clients,

        so only one may be in progress at a time. Attempting to initiate reclamation while one is in

        progress will result in an error. When NLM reclamation is initiated, all NLM locks are deleted

        and client applications are notified that they can reacquire their locks within a grace period.

        '
      parameters:
