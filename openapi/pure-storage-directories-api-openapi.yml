openapi: 3.0.1
info:
  title: FlashArray REST Active Directory Directories API
  version: '2.52'
  description: 'Active Directory configuration authenticates users for NFS using Kerberos or SMB using Kerberos

    or New Technology LAN Manager (NTLM). Active Directory is also used to authorize users by

    mapping identities across the NFS and SMB protocols by using LDAP queries.

    '
servers:
- url: /
tags:
- name: Directories
  description: 'Important file system directories should be set up as managed directories. Managed directories

    can have policies attached to them. Managed directories differ from standard directories in that

    they provide space reporting and metrics.

    '
paths:
  /api/2.52/directories:
    get:
      tags:
      - Directories
      summary: Pure Storage List Directories
      description: 'Displays a list of directories, including those pending eradication.

        '
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Allow_errors'
      - $ref: '#/components/parameters/Context_names_get'
      - $ref: '#/components/parameters/Continuation_token'
      - $ref: '#/components/parameters/Destroyed'
      - $ref: '#/components/parameters/File_system_ids'
      - $ref: '#/components/parameters/File_system_names'
      - $ref: '#/components/parameters/Filter'
      - $ref: '#/components/parameters/Ids'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Names'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Total_item_count'
      - $ref: '#/components/parameters/Total_only'
      - $ref: '#/components/parameters/Workload_ids'
      - $ref: '#/components/parameters/Workload_names'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryGetResponse'
        '207':
          description: 'Partial success. Some resources were returned, but there

            were also errors possibly preventing some resources from

            being returned.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryGetResponse'
    post:
      tags:
      - Directories
      summary: Pure Storage Create or Copy Directory
      description: 'Creates a managed directory at the specified path.

        The managed directory name must consist of a file system name prefix and a managed directory

        name suffix (separated with ''&#58;''). The suffix must be between 1 and 63 characters

        (alphanumeric and ''-'') in length and begin and end with a letter or number.

        The suffix must include at least one letter or ''-''.

        Set `names` to create a managed directory with the specified full managed directory name,

        or set `file_system_names` or `file_system_ids` in the query parameters and `suffix` in

        the body parameters to create a managed directory in the specified file system with the

        specified suffix. These two options are exclusive.

        The `add_to_policy_names` and `add_to_policy_ids` query parameters specify a list of policy

        names or ids, respectively, that will be applied to the newly created managed directory.

        These parameters are mutually exclusive.

        The `with_default_protection` query parameter specifies whether to use the container

        default protection configuration for the managed directory.

        '
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Add_to_policy_ids_directory'
      - $ref: '#/components/parameters/Add_to_policy_names_directory'
      - $ref: '#/components/parameters/Context_names'
      - $ref: '#/components/parameters/File_system_ids'
      - $ref: '#/components/parameters/File_system_names'
      - $ref: '#/components/parameters/Ignore_usage'
      - $ref: '#/components/parameters/Names'
      - $ref: '#/components/parameters/With_default_protection_policy_directory'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectoryPost'
        required: true
        x-codegen-request-body-name: directory
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryResponse'
      x-codegen-request-body-name: directory
    delete:
      tags:
      - Directories
      summary: Pure Storage Delete Managed Directories
      description: 'Deletes one or more managed directories.

        To be deleted, a managed directory must be empty and not attached to any enabled export

        policies. Deleted managed directories cannot be recovered.

        The `ids` or `names` parameter is required, but cannot be set together.

        '
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Context_names'
      - $ref: '#/components/parameters/Ids'
      - $ref: '#/components/parameters/Names'
      responses:
        '200':
          description: OK
          content: {}
    patch:
      tags:
      - Directories
      summary: Pure Storage Modify a Managed Directory
      description: 'Modifies a managed directory.

        To rename a managed directory, set `name` to the new name.

        The `ids` or `names` parameter is required, but cannot be set together.

        The `name` or `directory_name` parameter is required.


        '
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Context_names'
      - $ref: '#/components/parameters/Ids'
      - $ref: '#/components/parameters/Names'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectoryPatch'
        required: true
        x-codegen-request-body-name: directory
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryResponse'
      x-codegen-request-body-name: directory
