components:
  schemas:
    _timeAware:
      type: object
      properties:
        _as_of:
          description: The freshness of the data (timestamp in millis since epoch).
          type: integer
          format: int64
          readOnly: true
          example: 1502729489760
    ErrorNoContext:
      type: object
      properties:
        message:
          type: string
          example: Something was wrong
    DirectoryPost:
      type: object
      properties:
        directory_name:
          description: 'The managed directory name without the file system name prefix.

            A full managed directory name is constructed in the form of `FILE_SYSTEM:DIR` where

            `FILE_SYSTEM` is the file system name and `DIR` is the value of this field.

            `directory_name` is required if `file_system_names` or `file_system_ids` is set.

            `directory_name` cannot be set if `names` is set.

            '
          type: string
        path:
          description: 'Path of the managed directory in the file system.

            '
          type: string
        source:
          description: 'A managed directory snapshot to be copied in order to create

            a new managed directory.

            If not specified, the newly created managed directory will be empty.

            '
          title: Reference
          allOf:
          - $ref: '#/components/schemas/_reference'
        workload:
          $ref: '#/components/schemas/_workloadConfigurationReferencePost'
    _directorypolicyexportpostPolicies:
      type: object
      properties:
        export_enabled:
          description: 'If set to `true`, the export is enabled.

            If not specified, defaults to `true`.

            '
          type: boolean
          example: false
        export_name:
          description: 'The name of the export to create when applying the export policy to the directory.

            '
          type: string
        policy:
          description: 'Reference to the export policy to apply to the directory.

            '
          title: Reference
          allOf:
          - $ref: '#/components/schemas/_reference'
        server:
          description: 'Server to which the export policy is attached to.

            '
          title: Reference
          allOf:
          - $ref: '#/components/schemas/_reference'
    ResourceDirectorySpace:
      allOf:
      - $ref: '#/components/schemas/_builtIn'
      - $ref: '#/components/schemas/_context'
      - type: object
        properties:
          space:
            description: 'Displays size and space consumption information.

              '
            title: Space
            allOf:
            - $ref: '#/components/schemas/_space'
          time:
            description: 'The timestamp of when the data was taken, measured in milliseconds since the UNIX epoch.

              '
            type: integer
            format: int64
            readOnly: true
        x-readOnly: true
    _builtIn:
      description: 'A built-in resource. Many are singletons predefined by Purity (e.g., support

        settings). Some correspond to a piece of software, like an app, or hardware,

        like a controller. Others are created by the system in response to some event

        (e.g., alerts, audit records).


        Typically, a user can''t create, delete or rename a built-in resource. A few

        can be created or deleted, but not renamed because the names are meaningful

        to Purity (e.g., VIFs).

        '
      type: object
      properties:
        id:
          description: 'A globally unique, system-generated ID.

            The ID cannot be modified and cannot refer to another resource.

            '
          type: string
          readOnly: true
        name:
          description: 'A locally unique, system-generated name. The name cannot be modified.

            '
          type: string
          readOnly: true
    UserGroup:
      type: object
      properties:
        id:
          description: 'The user or group id.

            '
          type: integer
          format: int64
          readOnly: true
        name:
          description: 'The name of the user or group.

            '
          type: string
          readOnly: true
        sid:
          description: 'The user or group Security Identifier (SID).

            '
          type: string
          readOnly: true
    _workloadConfigurationReferencePost:
      type: object
      description: 'The workload to which the resource is added.

        Set one of `id` or `name`, and `configuration` to add the resource to the workload

        and configure it based on the `configuration` from the preset revision the workload was

        originally provisioned from.

        '
      allOf:
      - $ref: '#/components/schemas/_referenceWithFixedType'
      - type: object
        properties:
          configuration:
            description: 'The name of the preset configuration object.

              '
            type: string
    UserGroupQuotaLimitedBy:
      type: object
      properties:
        member:
          description: 'Reference to the resource to which the effective user-group-quota

            or quota policy is attached.

            '
          title: FixedReferenceWithType
          allOf:
          - $ref: '#/components/schemas/_fixedReferenceWithType'
        policy:
          description: 'Reference to the effective user-group-quota or quota policy.

            '
          title: FixedReferenceWithType
          allOf:
          - $ref: '#/components/schemas/_fixedReferenceWithType'
      x-readOnly: true
    _builtInAsOf:
      description: 'A built-in resource. Many are singletons predefined by Purity (e.g., support

        settings). Some correspond to a piece of software, like an app, or hardware,

        like a controller. Others are created by the system in response to some event

        (e.g., alerts, audit records).


        Typically, a user can''t create, delete or rename a built-in resource. A few

        can be created or deleted, but not renamed because the names are meaningful

        to Purity (e.g., VIFs).


        '
      allOf:
      - $ref: '#/components/schemas/_timeAware'
      - type: object
        properties:
          id:
            description: A non-modifiable, globally unique ID chosen by the system.
            type: string
            readOnly: true
            example: 01c2889a-4124-49ff-8cbd-c33405ede123
          name:
            description: A non-modifiable, locally unique name chosen by the system.
            type: string
            readOnly: true
            example: example_name
    DirectoryUser:
      allOf:
      - $ref: '#/components/schemas/_resource'
      - $ref: '#/components/schemas/_context'
      - type: object
        properties:
          directory_name:
            description: 'The managed directory name without the file system name prefix.

              A full managed directory name is constructed in the form of `FILE_SYSTEM:DIR` where

              `FILE_SYSTEM` is the file system name and `DIR` is the value of this field.

              '
            type: string
            readOnly: true
          file_system:
            description: 'The file system that the managed directory is in.

              '
            title: FixedReference
            allOf:
            - $ref: '#/components/schemas/_fixedReference'
          limited_by:
            description: 'The user-group-quota or quota policy that is limiting usage for this user in this

              managed directory.

              This policy defines the total amount of space allowed for this user or this managed

              directory.

              The returned value contains two parts&#58; the name of the policy and the managed directory

              to which the policy is attached.

              '
            title: UserGroupQuotaLimitedBy
            allOf:
            - $ref: '#/components/schemas/UserGroupQuotaLimitedBy'
          path:
            description: 'Absolute path of the managed directory in the file system.

              '
            type: string
            readOnly: true
          space:
            description: 'The logical space owned by the user.

              '
            title: UserGroupSpace
            allOf:
            - $ref: '#/components/schemas/UserGroupSpace'
          user:
            description: 'A user which has content in the managed directory.

              '
            title: UserGroup
            allOf:
            - $ref: '#/components/schemas/UserGroup'
    _space:
      type: object
      properties:
        data_reduction:
          description: 'The ratio of mapped sectors within a volume versus

            the amount of physical space the data occupies after data compression and deduplication.

            The data reduction ratio does not include thin provisioning savings.

            For example, a data reduction ratio of 5:1 means that

            for every 5 MB the host writes to the array, 1 MB is stored on the array''s flash modules.

            '
          type: number
          format: float
          readOnly: true
        footprint:
          description: 'The maximum amount of physical space the container consumes on an array,

            ignoring any data shared outside the container, measured in bytes.

            On Evergreen//One arrays, this is the maximum amount of effective used space.

            The footprint metric is mostly used for capacity planning.

            This field will be null in non-container contexts.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        shared:
          description: 'The physical space occupied by deduplicated data, meaning that the space is shared with other

            volumes and snapshots as a result of data deduplication.

            Measured in bytes.

            On Evergreen//One arrays, this is the effective space contributed by data that is not unique

            to a specific volume, managed directory, or snapshot, measured in bytes.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          example: 111863360624
        snapshots:
          description: 'The physical space occupied by data unique to one or more snapshots.

            Measured in bytes.

            On Evergreen//One arrays, this is the effective space contributed by data unique to one or

            more snapshots, measured in bytes.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        system:
          description: 'The physical space occupied by internal array metadata. Measured in bytes.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        thin_provisioning:
          description: 'The percentage of volume sectors that do not contain host-written data

            because the hosts have not written data to them or the sectors have been explicitly trimmed.

            '
          type: number
          format: float
          minimum: 0
          maximum: 1
          readOnly: true
        total_physical:
          description: 'This field has been deprecated.

            Use the `total_used` field, as it contains the same information.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        total_provisioned:
          description: 'The provisioned size of a volume for a single volume, host or host group,

            protocol endpoint, managed directory, and containers can be infinite or measured in bytes.

            Infinite is represented by `null`.

            The provisioned size for a host or host group, includes all volumes

            that are connected to the resource.

            The provisioned size for a protocol endpoint is `null`.

            The provisioned size for a managed directory is the quota limit if it

            or its parent has a managed directory configured, otherwise it defaults to `null`.

            The provisioned size for a container is the sum of the total_provisioned

            of the object it contains, capped by the container''s quota limit

            (or the container''s used_provisioned if current usage is above the quota limit), if any.

            Provisioned size represents the storage capacity reported to hosts.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          example: 19937690345472
        total_reduction:
          description: 'The ratio of provisioned sectors within a volume versus

            the amount of physical space the data occupies

            after reduction via data compression and deduplication

            and with thin provisioning savings.

            Total reduction is data reduction with thin provisioning savings.

            For example, a total reduction ratio of 10&#58;1 means that

            for every 10 MB of provisioned space,

            1 MB is stored on the array''s flash modules.


            '
          type: number
          format: float
          readOnly: true
        total_used:
          description: 'The total space contributed by customer data, measured in bytes.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        unique:
          description: 'The unique physical space occupied by customer data.

            Unique physical space does not include shared space, snapshots, and internal array metadata.

            Measured in bytes.

            On Evergreen//One arrays, this is the effective space contributed by unique customer data,

            measured in bytes.

            Unique data does not include shared space, snapshots, and internal array metadata.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        used_provisioned:
          description: 'The amount of logical space a container has consumed,

            compared against the quota limit if the container has one configured.

            Used provisioned does not include destroyed objects inside the container.

            Used provisioned can include destroyed objects for a destroyed container

            and represents how much logical space it would take to recover the container.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          example: 19937690345472
        virtual:
          description: 'The amount of logically written data that a volume or a snapshot references.

            Measured in bytes.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
    PolicyMember:
      allOf:
      - $ref: '#/components/schemas/_policy_member_base'
      - type: object
        properties:
          destroyed:
            description: 'Returns a value of `true` if the member is destroyed.

              '
            type: boolean
            readOnly: true
          enabled:
            description: 'Returns a value of `true` if the policy is enabled.

              '
            type: boolean
