    TagBatch:
      type: object
      properties:
        copyable:
          description: 'Specifies whether or not to include the tag when copying the parent resource.

            If set to `true`, the tag is included in resource copying.

            If set to `false`, the tag is not included.

            If not specified, defaults to `true`.

            '
          type: boolean
          example: true
        key:
          description: 'Key of the tag. Supports up to 64 Unicode characters.

            '
          type: string
          example: environment
        namespace:
          description: 'Optional namespace of the tag.

            Namespace identifies the category of the tag. Omitting the namespace

            defaults to the namespace `default`. The `pure&#42;` namespaces are

            reserved for plugins and integration partners. It is recommended

            that customers avoid using reserved namespaces.

            '
          type: string
          example: default
        resource:
          description: 'A reference to the parent object.

            '
          title: Reference
          allOf:
          - $ref: '#/components/schemas/_reference'
        value:
          description: 'Value of the tag. Supports up to 256 Unicode characters.

            '
          type: string
          example: staging
    TagResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
    _qos_bw_limit_type:
      type: integer
      format: int64
      minimum: 1048576
      maximum: 549755813888
    VolumeResponse:
      type: object
      properties:
        items:
          description: 'Displays a list of all items after filtering.

            If applicable, the values are displayed for each name.

            If `total_only=true`, the `items` list is empty.

            '
          type: array
          items:
            $ref: '#/components/schemas/Volume'
    MemberGetResponse:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - $ref: '#/components/schemas/MemberResponse'
      - $ref: '#/components/schemas/_errorContextResponse'
    _qos_iops_limit_type:
      type: integer
      format: int64
      minimum: 100
      maximum: 100000000
    _volumeCommon:
      allOf:
      - $ref: '#/components/schemas/_resource'
      - description: 'A random access virtual storage device that a FlashArray exports to hosts via a

          logical unit number (LUN). For a host, a volume contains a number of 512-byte sectors in which

          data can be written and from which it can be read.

          '
        type: object
        properties:
          connection_count:
            description: 'The total number of hosts and host groups connected to the volume.

              '
            type: integer
            format: int64
            readOnly: true
          created:
            description: 'The volume creation time, measured in milliseconds since the UNIX epoch.

              '
            type: integer
            format: int64
            readOnly: true
          destroyed:
            description: 'Returns a value of `true` if the volume has been destroyed and is pending eradication.

              The `time_remaining` value displays the amount of time left until the destroyed volume is

              permanently eradicated.

              Before the `time_remaining` period has elapsed, the destroyed volume can be recovered

              by setting `destroyed=false`.

              Once the `time_remaining` period has elapsed, the volume is permanently eradicated and can

              no longer be recovered.

              '
            type: boolean
          host_encryption_key_status:
            description: 'The host encryption key status for this volume.

              Values include `none`, `detected`, and `fetched`.

              '
            type: string
            readOnly: true
            example: detected
          priority_adjustment:
            description: 'Priority adjustment operator and value.

              '
            title: PriorityAdjustment
            allOf:
            - $ref: '#/components/schemas/_priorityAdjustment'
          provisioned:
            description: 'The virtual size of the volume as a multiple of 512, measured in bytes.

              The maximum size is 4503599627370496 (4PB).

              '
            type: integer
            format: int64
          qos:
            description: 'Displays QoS limit information.

              '
            title: Qos
            allOf:
            - $ref: '#/components/schemas/_qos'
          serial:
            description: 'A globally unique serial number generated by the FlashArray when the volume is created.

              '
            type: string
            readOnly: true
          space:
            description: 'Displays size and space consumption information.

              '
            title: VolumeSpaceCommon
            allOf:
            - $ref: '#/components/schemas/_volumeSpaceCommon'
          time_remaining:
            description: 'The amount of time left until the destroyed volume is permanently eradicated,

              measured in milliseconds.

              Before the `time_remaining` period has elapsed, the destroyed volume can be recovered

              by setting `destroyed=false`.

              '
            type: integer
            format: int64
            readOnly: true
    _qos_patch:
      type: object
      properties:
        bandwidth_limit:
          description: 'The maximum QoS bandwidth limit for the volume, measured in `bytes per second`.

            Throttling occurs when throughput exceeds this limit. The maximum supported

            limit is `512 GB/s`. Specifying an empty string `""` unsets the limit.

            '
          title: QosBandwidthLimitPatch
          oneOf:
          - $ref: '#/components/schemas/_qos_bw_limit_type'
          - $ref: '#/components/schemas/_limit_unset_value'
        iops_limit:
          description: 'The QoS `IOPS` limit for the volume. Specifying an empty string `""`

            unsets the limit.

            '
          title: QosIopsLimitPatch
          oneOf:
          - $ref: '#/components/schemas/_qos_iops_limit_type'
          - $ref: '#/components/schemas/_limit_unset_value'
    _limit_unset_value:
      type: string
      minLength: 0
      maxLength: 0
    ResourcePerformanceByArray:
      allOf:
      - $ref: '#/components/schemas/ResourcePerformance'
      - type: object
        properties:
          array:
            description: 'The array on which the performance metrics were recorded.

              '
            title: Resource
            allOf:
            - $ref: '#/components/schemas/_resource'
    _fixedReferenceFqdn:
      allOf:
      - $ref: '#/components/schemas/_fixedReference_2'
      - type: object
        properties:
          fqdn:
            description: 'The fully qualified domain name of the appliance when `resource_type` is `arrays`,

              `null` otherwise.

              '
            type: string
            readOnly: true
            example: example_name.dc1.example.com
    _fixedReference_2:
      type: object
      properties:
        id:
          description: The opaque and unique id of this resource.
          type: string
          readOnly: true
          example: 2a989a09-c851-4d52-9ec6-ab728b1c04db
        name:
          description: The name of this resource.
          type: string
          readOnly: true
          example: example_name
        resource_type:
          description: 'The type of this resource represented by the name of its REST endpoint.

            For example, "arrays", "network-interfaces", and "metrics".

            The value may be `null` if the resource is not represented.

            '
          type: string
          readOnly: true
          example: example_resource_type
      x-readOnly: true
    _protocol_endpoint:
      type: object
      properties:
        container_version:
          description: 'Defines vCenter and EXSi host compatibility of the protocol endpoint

            and its associated container.

            Valid values include: `1`, `2`, `3`.

            When `container_version` is set to `1`, it''s compatible with vSphere version 7.0.1 or higher.

            When `container_version` is set to `2`, it''s compatible with vSphere version 8.0.0 or higher.

            When `container_version` is set to `3`, it''s compatible with vSphere version 8.0.1 or higher.

            The default `container_version` is `1`.

            '
          type: string
          example: '1'
    _destroyedPatchPost:
      type: object
      properties:
        destroyed:
          description: 'If set to `true`, destroys a resource. Once set to `true`,

            the `time_remaining` value will display the amount of time left

            until the destroyed resource is permanently eradicated.

            Before the `time_remaining` period has elapsed, the destroyed resource

            can be recovered by setting `destroyed=false`.

            Once the `time_remaining` period has elapsed,

            the resource is permanently eradicated and can no longer be recovered.

            '
          type: boolean
    _arraysResource:
      description: 'A built-in resource that exists on one or multiple arrays.

        '
      allOf:
      - $ref: '#/components/schemas/_resource_2'
      - $ref: '#/components/schemas/_arrays'
    PageInfo:
      type: object
      properties:
        continuation_token:
          description: 'Continuation token that can be provided in the `continuation_token`

            query param to get the next page of data.

            If you use the continuation token to page through data you

            are guaranteed to get all items exactly once regardless of

            how items are modified. If an item is added or deleted during

            the pagination then it may or may not be returned.

            The continuation token is generated if the limit is less

            than the remaining number of items, and the default sort is used

            (no sort is specified).

            '
          type: string
        more_items_remaining:
          description: 'Returns a value of `true` if subsequent items can be retrieved.

            '
          type: boolean
          example: false
        total_item_count:
          description: 'The total number of records after applying all filter query parameters.

            The `total_item_count` will be calculated if and only if the corresponding

            query parameter `total_item_count` is set to `true`. If this query parameter

            is not set or set to `false`, a value of `null` will be returned.

            '
          type: integer
          format: int32
    TagGetResponse:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - $ref: '#/components/schemas/TagResponse'
      - $ref: '#/components/schemas/_errorContextResponse'
    _errorContextResponse:
      type: object
      properties:
        errors:
          description: The list of errors encountered when attempting to perform an operation.
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/_errorcontextresponseErrors'
    _referenceWithFixedType:
      type: object
      properties:
        id:
          description: 'A globally unique, system-generated ID.

            The ID cannot be modified.

            '
          type: string
        name:
          description: 'The resource name,

            such as volume name, pod name, snapshot name, and so on.

            '
          type: string
        resource_type:
