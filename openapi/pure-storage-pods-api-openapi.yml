      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResultWithResourceWithIdPostResponse'
      x-codegen-request-body-name: pod
  /api/1.5/pods:
    get:
      tags:
      - Pods
      summary: Pure Storage Get Pods
      description: 'Retrieves information about pod objects.

        '
      parameters:
      - $ref: '#/components/parameters/Authorization_2'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Continuation_token_2'
      - $ref: '#/components/parameters/Filter_2'
      - $ref: '#/components/parameters/Ids_2'
      - $ref: '#/components/parameters/Limit_2'
      - $ref: '#/components/parameters/Names_2'
      - $ref: '#/components/parameters/Offset_2'
      - $ref: '#/components/parameters/Sort_2'
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              description: Supplied by client during request or generated by server.
              schema:
                type: string
            X-RateLimit-Remaining-second:
              description: 'The number of requests remaining for the organization in that second.

                '
              schema:
                type: integer
            X-RateLimit-Remaining-minute:
              description: 'The number of requests remaining for the organization in that minute.

                '
              schema:
                type: integer
            X-RateLimit-Limit-second:
              description: The number of requests available per second.
              schema:
                type: integer
            X-RateLimit-Limit-minute:
              description: The number of requests available per minute.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodGetResponse_2'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
components:
  schemas:
    ContainerPerformanceGetResponse:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - $ref: '#/components/schemas/_errorContextResponse'
      - type: object
        properties:
          items:
            description: 'Performance data.

              If `total_only=true`, the `items` list will be empty.

              '
            type: array
            items:
              $ref: '#/components/schemas/ContainerPerformance'
          total:
            description: 'The aggregate value of all items after filtering.

              When applicable, the average value is displayed instead.

              If applicable, the values are displayed for each field.

              '
            type: array
            items:
              $ref: '#/components/schemas/ContainerPerformance'
    ErrorNoContext:
      type: object
      properties:
        message:
          type: string
          example: Something was wrong
    Tag:
      allOf:
      - $ref: '#/components/schemas/_context'
      - type: object
        properties:
          copyable:
            description: 'Specifies whether or not to include the tag when copying the parent resource.

              If set to `true`, the tag is included in resource copying.

              If set to `false`, the tag is not included.

              If not specified, defaults to `true`.

              '
            type: boolean
            example: true
          key:
            description: 'Key of the tag. Supports up to 64 Unicode characters.

              '
            type: string
            example: environment
          namespace:
            description: 'Optional namespace of the tag.

              Namespace identifies the category of the tag. Omitting the namespace

              defaults to the namespace `default`. The `pure&#42;` namespaces are

              reserved for plugins and integration partners. It is recommended

              that customers avoid using reserved namespaces.

              '
            type: string
            example: default
          resource:
            $ref: '#/components/schemas/_fixedReference'
          value:
            description: 'Value of the tag. Supports up to 256 Unicode characters.

              '
            type: string
            example: staging
    _performance_others:
      type: object
      properties:
        mirrored_others_per_sec:
          description: The number of mirrored other requests processed per second.
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        others_per_sec:
          description: The number of other requests processed per second.
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        usec_per_mirrored_other_op:
          description: 'The average time it takes the array to process a mirrored I/O other request, measured in

            microseconds.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        usec_per_other_op:
          description: 'The average time it takes the array to process an I/O other request, measured in

            microseconds.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
      x-readOnly: true
    PodGetResponse:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - $ref: '#/components/schemas/PodResponse'
      - $ref: '#/components/schemas/_errorContextResponse'
      - type: object
        properties:
          total:
            description: 'The aggregate value of all items after filtering. When applicable, the average value is

              displayed instead. The values are displayed for each field, if meaningful.

              '
            type: array
            items:
              $ref: '#/components/schemas/Pod'
    _pod_array_status:
      allOf:
      - $ref: '#/components/schemas/_reference'
      - type: object
        properties:
          frozen_at:
            description: 'The timestamp of when the data on the pod was frozen when the array went offline.

              Measured in milliseconds since the UNIX epoch.

              Also known as the recovery point.

              If the pod is in sync, a value of `null` will be returned.

              '
            type: integer
            format: int64
            readOnly: true
            example: 1492662000
          mediator_status:
            description: 'The status of the mediator,

              which determines whether it is available to mediate a high availability event.

              Valid values are `flummoxed`, `online`, `unknown`, and `unreachable`.

              Only mediators in the `online` status can mediate high availability events.

              If set to `flummoxed`, the array can reach a mediator, but it is talking to the wrong one.

              Verify that the DNS in the environment is properly configured.

              This status might also appear if the pod has been offline on one array

              for an extended period of time and the peer array is unreachable.

              If set to `online`, the array is successfully communicating with the mediator,

              and the mediator is available to mediate a high availability event.

              If set to `unreachable`, the array cannot reach the mediator,

              either due to network issues or because the mediator is down.

              When a mediator is unreachable, synchronous replication continues to function

              provided all arrays are healthy and communicating,

              but a high availability event without mediator access can result in an outage.

              '
            type: string
            readOnly: true
          member:
            description: 'A reference to the member associated with the pod''s array status.

              '
            title: ReferenceWithType
            allOf:
            - $ref: '#/components/schemas/_referenceWithType'
          pre_elected:
            description: 'If set to `true`, the array has been pre-elected to remain online

              in the rare event that the mediator is inaccessible on both arrays within the stretched pod,

              and then later, the arrays within the stretched pod become disconnected from each other.

              If set to `false`, either the array has been pre-elected to remain offline

              while its peer array remains online, or pre-election is not in effect.

              One and only one array within each pod is pre-elected at a given point in time,

              so while a pre-elected array is keeping the pod online,

              the pod on its non-elected peer array remains offline during the

              communication failure. Users cannot pre-elect arrays.

              '
            type: boolean
            readOnly: true
          progress:
            description: 'The percentage progress of the pod resyncing process for this array.

              The percentage is displayed as a decimal value, starting at 0.00 and ending at 1.00.

              '
            type: number
            format: float
            readOnly: true
            example: 0.66
          status:
            description: 'The status of the array within the stretched pod.

              Valid values are `offline`, `online`, `resyncing`, `suspended`, and `unknown`.

              If set to `offline`, the array is experiencing connection problems

              and may not have the latest pod data.

              The array cannot handle I/O to the pod and cannot take over

              during a high availability event.

              If set to `online`, the array is online and has the latest pod data.

              The array can handle I/O to the pod and take over during a high availability event.

              If set to `suspended`, the array is experiencing a short connection glitch of the pod.

              This is a temporary status and would transition to either `online` or `offline` soon.

              `suspended` is a new status that is exposed, starting from version 6.6.0.

              If set to `resyncing`, the array is actively getting the latest pod data

              so that it becomes fully synchronized with its peer array.

              During the resyncing process, the array cannot handle I/O to the pod.

              Once the arrays are fully synchronized, the array changes to `online` status.

              If set to `unknown`, the status of the peer array is unknown

              because this array is offline and cannot determine the state of the pod on the peer array.

              Only the peer array can ever be in unknown status; this unknown status

              is unique to the local array and will differ when viewed from its peer array.

              '
            type: string
            readOnly: true
            example: resyncing
        x-readOnly: true
    _builtIn:
      description: 'A built-in resource. Many are singletons predefined by Purity (e.g., support

        settings). Some correspond to a piece of software, like an app, or hardware,

        like a controller. Others are created by the system in response to some event

        (e.g., alerts, audit records).


        Typically, a user can''t create, delete or rename a built-in resource. A few

        can be created or deleted, but not renamed because the names are meaningful

        to Purity (e.g., VIFs).

        '
      type: object
      properties:
        id:
          description: 'A globally unique, system-generated ID.

            The ID cannot be modified and cannot refer to another resource.

            '
          type: string
          readOnly: true
        name:
          description: 'A locally unique, system-generated name. The name cannot be modified.

            '
          type: string
          readOnly: true
    _space:
      type: object
      properties:
        data_reduction:
          description: 'The ratio of mapped sectors within a volume versus

            the amount of physical space the data occupies after data compression and deduplication.

            The data reduction ratio does not include thin provisioning savings.

            For example, a data reduction ratio of 5:1 means that

            for every 5 MB the host writes to the array, 1 MB is stored on the array''s flash modules.

            '
          type: number
          format: float
          readOnly: true
        footprint:
          description: 'The maximum amount of physical space the container consumes on an array,

            ignoring any data shared outside the container, measured in bytes.

            On Evergreen//One arrays, this is the maximum amount of effective used space.

            The footprint metric is mostly used for capacity planning.

            This field will be null in non-container contexts.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        shared:
          description: 'The physical space occupied by deduplicated data, meaning that the space is shared with other

            volumes and snapshots as a result of data deduplication.

            Measured in bytes.

            On Evergreen//One arrays, this is the effective space contributed by data that is not unique

            to a specific volume, managed directory, or snapshot, measured in bytes.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          example: 111863360624
        snapshots:
          description: 'The physical space occupied by data unique to one or more snapshots.

            Measured in bytes.

            On Evergreen//One arrays, this is the effective space contributed by data unique to one or

            more snapshots, measured in bytes.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        system:
          description: 'The physical space occupied by internal array metadata. Measured in bytes.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        thin_provisioning:
          description: 'The percentage of volume sectors that do not contain host-written data

            because the hosts have not written data to them or the sectors have been explicitly trimmed.

            '
          type: number
          format: float
          minimum: 0
          maximum: 1
          readOnly: true
        total_physical:
          description: 'This field has been deprecated.

            Use the `total_used` field, as it contains the same information.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        total_provisioned:
          description: 'The provisioned size of a volume for a single volume, host or host group,

            protocol endpoint, managed directory, and containers can be infinite or measured in bytes.

            Infinite is represented by `null`.

            The provisioned size for a host or host group, includes all volumes

            that are connected to the resource.

            The provisioned size for a protocol endpoint is `null`.

            The provisioned size for a managed directory is the quota limit if it

            or its parent has a managed directory configured, otherwise it defaults to `null`.

            The provisioned size for a container is the sum of the total_provisioned

            of the object it contains, capped by the container''s quota limit

            (or the container''s used_provisioned if current usage is above the quota limit), if any.

            Provisioned size represents the storage capacity reported to hosts.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          example: 19937690345472
        total_reduction:
          description: 'The ratio of provisioned sectors within a volume versus

            the amount of physical space the data occupies

            after reduction via data compression and deduplication

            and with thin provisioning savings.

            Total reduction is data reduction with thin provisioning savings.

            For example, a total reduction ratio of 10&#58;1 means that

            for every 10 MB of provisioned space,

            1 MB is stored on the array''s flash modules.


            '
          type: number
          format: float
          readOnly: true
        total_used:
          description: 'The total space contributed by customer data, measured in bytes.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        unique:
          description: 'The unique physical space occupied by customer data.

            Unique physical space does not include shared space, snapshots, and internal array metadata.

            Measured in bytes.

            On Evergreen//One arrays, this is the effective space contributed by unique customer data,

            measured in bytes.

            Unique data does not include shared space, snapshots, and internal array metadata.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        used_provisioned:
          description: 'The amount of logical space a container has consumed,

            compared against the quota limit if the container has one configured.

            Used provisioned does not include destroyed objects inside the container.

            Used provisioned can include destroyed objects for a destroyed container

            and represents how much logical space it would take to recover the container.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          example: 19937690345472
        virtual:
          description: 'The amount of logically written data that a volume or a snapshot references.

            Measured in bytes.

            '
          type: integer
          format: int64
          minimum: 0
          readOnly: true
    PodPerformanceReplicationByArray:
      allOf:
      - $ref: '#/components/schemas/_podPerformanceReplication'
      - type: object
        properties:
          array:
            description: 'Array that shares this pod.

              '
            title: Resource
            allOf:
            - $ref: '#/components/schemas/_resource'
          member:
            description: 'The member that shares this pod.

              '
            title: FixedReferenceWithType
            allOf:
            - $ref: '#/components/schemas/_fixedReferenceWithType'
    PodPerformanceReplicationByArrayGetResponse:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - $ref: '#/components/schemas/PodPerformanceReplicationByArrayResponse'
      - $ref: '#/components/schemas/_errorContextResponse'
    PodPerformance:
      allOf:
      - $ref: '#/components/schemas/_performance'
      - $ref: '#/components/schemas/_performance_others'
      - $ref: '#/components/schemas/_resource'
      - $ref: '#/components/schemas/_context'
    PodPatch:
      allOf:
      - $ref: '#/components/schemas/_resource'
      - description: 'A pod is an administrative domain, a data container, and a namespace for

          volumes and protection groups.

          '
        type: object
        properties:
          destroyed:
            description: 'If set to `true`, the pod has been destroyed and is pending eradication.

              The `time_remaining` value displays the amount of time left

              until the destroyed pod is permanently eradicated.

              A pod can only be destroyed if it is empty, so before destroying a pod,

              ensure all volumes and protection groups inside the pod

              have been either moved out of the pod or destroyed.

              A stretched pod cannot be destroyed unless you unstretch it first.

              Before the `time_remaining` period has elapsed, the destroyed pod can be recovered

              by setting `destroyed=false`.

              Once the `time_remaining` period has elapsed,

              the pod is permanently eradicated and can no longer be recovered.

              '
            type: boolean
          failover_preferences:
            description: 'Determines which array within a stretched pod should be given priority to stay online

              should the arrays ever lose contact with each other. The current array and

              any peer arrays that are connected to the current array for synchronous replication can be

              added to a pod for failover preference.

              By default, `failover_preferences=null`,

              meaning no arrays have been configured for failover preference.

              Enter multiple arrays in comma-separated format.

              '
            type: array
            items:
              $ref: '#/components/schemas/_reference'
          ignore_usage:
            description: 'Set to `true` to set a `quota_limit` that is lower than the existing usage.

              This ensures that no new volumes can be created until the existing usage

              drops below the `quota_limit`.

              If not specified, defaults to `false`.

              '
            type: boolean
          mediator:
            description: 'Sets the URL of the mediator for this pod, replacing the URL of the current mediator.

              By default, the Pure1 Cloud Mediator (`purestorage`) serves as the mediator.

              '
            type: string
            example: https://mediator.cloud-support.purestorage.com
          requested_promotion_state:
            description: 'Patch `requested_promotion_state` to `demoted` to demote the pod so that it can be used as

              a link target for continuous replication between pods.

              Demoted pods do not accept write requests, and a destroyed version of the pod with

              `undo-demote` appended to the pod name is created on the array with the state of the pod

              when it was in the promoted state.

              Patch `requested_promotion_state` to `promoted` to start the process of promoting the pod.

              The `promotion_status` indicates when the pod has been successfully promoted.

              Promoted pods stop incorporating replicated data from the source pod and start accepting

              write requests.

              The replication process does not stop when the source pod continues replicating data to the

              pod.

              The space consumed by the unique replicated data is tracked by the `space.journal` field

              of the pod.

              '
            type: string
      - $ref: '#/components/schemas/_quota_limit_patch'
    MemberResponse:
      type: object
      properties:
        items:
          description: 'Displays a list of all items after filtering.

            The values are displayed for each name where meaningful.

            If `total_only=true`, the `items` list will be empty.

            '
          type: array
          items:
            $ref: '#/components/schemas/Member'
    PodPerformanceReplicationResponse:
      type: object
      properties:
        items:
          description: A list of pod performance replication objects.
          type: array
          items:
            $ref: '#/components/schemas/PodPerformanceReplication'
        total:
          description: 'The aggregate value of all items after filtering.

            For real-time performance, the values are aggregated for the latest timestamp.

            For historical performance, the values are aggregated for each timestamp from

            `start_time` to `end_time`. When applicable, the average value is displayed

            instead. The values are displayed for each field if meaningful.

            '
          type: array
          items:
            $ref: '#/components/schemas/PodPerformanceReplication'
    _errorErrors:
      type: object
      properties:
        context:
          type: string
          example: Error with ...
        message:
          type: string
          example: Something was wrong
    _resource:
      description: 'An ordinary (as opposed to built-in) resource that can be created, named,

        renamed or deleted by the user. This might be a virtual resource (e.g., a

        file system), or correspond to something in the environment, like a host or a

        server.

        '
      type: object
      properties:
        id:
          description: 'A globally unique, system-generated ID.

            The ID cannot be modified and cannot refer to another resource.

            '
          type: string
          readOnly: true
        name:
          description: 'A user-specified name.

            The name must be locally unique and can be changed.

            '
          type: string
    TagResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
    PodMemberResponse:
      type: object
      properties:
        items:
          description: 'Displays a list of all items after filtering.

            The values are displayed for each name where meaningful.

            If `total_only=true`, the `items` list will be empty.

            '
          type: array
          items:
            $ref: '#/components/schemas/PodMember'
    MemberGetResponse:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - $ref: '#/components/schemas/MemberResponse'
      - $ref: '#/components/schemas/_errorContextResponse'
    _quota_limit_type:
      type: integer
      format: int64
      minimum: 1048576
      maximum: 4503599627370496
    ResourcePodSpaceGetResponse:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - $ref: '#/components/schemas/_errorContextResponse'
      - type: object
        properties:
          items:
            description: 'Displays a list of all items after filtering.

              If applicable, the values are displayed for each name.

              If `total_only=true`, the `items` list will be empty.

              '
            type: array
            items:
              $ref: '#/components/schemas/ResourcePodSpace'
          total:
            description: 'The aggregate value of all items after filtering.

              When applicable, the average value is displayed instead.

              If applicable, the values are displayed for each field.

              '
            type: array
            items:
              $ref: '#/components/schemas/ResourcePodSpace'
    PodGetResponse_2:
      allOf:
      - $ref: '#/components/schemas/PageInfo_2'
      - $ref: '#/components/schemas/PodResponse'
    _limit_unset_value:
      type: string
      minLength: 0
      maxLength: 0
    _podPerformanceReplication:
      allOf:
      - $ref: '#/components/schemas/_context'
      - type: object
        properties:
          continuous_bytes_per_sec:
            description: 'Total bytes transmitted or received per second for continuous replication.

              The continuous replication feature is used for disaster recovery on FlashArray and provides a

              recovery point objective (RPO) of significantly less than 30s.

              '
            title: ReplicationPerformanceWithTotal
            allOf:
            - $ref: '#/components/schemas/_replicationPerformanceWithTotal'
          periodic_bytes_per_sec:
            description: 'Total bytes transmitted or received per second for periodic replication.

              '
            title: ReplicationPerformanceWithTotal
            allOf:
            - $ref: '#/components/schemas/_replicationPerformanceWithTotal'
          pod:
            description: Reference to the pod that the performance data is associated with.
            title: FixedReference
            allOf:
            - $ref: '#/components/schemas/_fixedReference'
          resync_bytes_per_sec:
            description: 'Total bytes transmitted or received per second during resync replication.

              Resync replication is the mechanism to bring two arrays into sync.

              This may occur during an initial pod stretch, or, in case of outage,

              when two arrays reestablish connection. After the connection is restored,

              the array that was online starts replicating pod data

              to its peer array until the pod is once again in sync.

              '
            title: ReplicationPerformanceWithTotal
            allOf:
            - $ref: '#/components/schemas/_replicationPerformanceWithTotal'
          sync_bytes_per_sec:
            description: 'Total bytes transmitted or received per second for synchronous replication.

              '
            title: ReplicationPerformanceWithTotal
            allOf:
            - $ref: '#/components/schemas/_replicationPerformanceWithTotal'
          time:
            description: Sample time in milliseconds since the UNIX epoch.
            type: integer
            format: int64
            readOnly: true
          total_bytes_per_sec:
            description: 'Total bytes transmitted and received per second for all types of replication.

              '
            type: integer
            format: int64
            minimum: 0
            readOnly: true
        x-readOnly: true
    PageInfo:
      type: object
      properties:
        continuation_token:
          description: 'Continuation token that can be provided in the `continuation_token`

            query param to get the next page of data.

            If you use the continuation token to page through data you

            are guaranteed to get all items exactly once regardless of

            how items are modified. If an item is added or deleted during

            the pagination then it may or may not be returned.

            The continuation token is generated if the limit is less

            than the remaining number of items, and the default sort is used

            (no sort is specified).

            '
          type: string
        more_items_remaining:
          description: 'Returns a value of `true` if subsequent items can be retrieved.

            '
          type: boolean
          example: false
        total_item_count:
          description: 'The total number of records after applying all filter query parameters.

            The `total_item_count` will be calculated if and only if the corresponding

            query parameter `total_item_count` is set to `true`. If this query parameter

            is not set or set to `false`, a value of `null` will be returned.

            '
          type: integer
          format: int32
    TagGetResponse:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - $ref: '#/components/schemas/TagResponse'
      - $ref: '#/components/schemas/_errorContextResponse'
    _errorContextResponse:
      type: object
      properties:
        errors:
          description: The list of errors encountered when attempting to perform an operation.
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/_errorcontextresponseErrors'
    Error:
      type: object
      properties:
        errors:
          description: The list of errors encountered.
          type: array
          items:
            $ref: '#/components/schemas/_errorErrors'
    PodMember:
      allOf:
      - $ref: '#/components/schemas/_context'
      - type: object
        properties:
          member:
            $ref: '#/components/schemas/_referenceWithType'
          pod:
            $ref: '#/components/schemas/_referenceWithType'
    TestResult:
      type: object
      properties:
        component_address:
          description: Address of the component running the test.
          type: string
          example: 10.230.94.21
        component_name:
          description: Name of the component running the test.
          type: string
          example: CT0
        description:
          description: What the test is doing.
          type: string
          example: Testing phonehome connectivity
        destination:
          description: The URI of the target server being tested.
          type: string
          example: ra.cloud-support.purestorage.com
        enabled:
          description: 'Whether the object being tested is enabled or not.

            Returns a value of `true` if the the service is enabled.

            Returns a value of `false` if the service is disabled.

            '
          type: boolean
          example: true
        result_details:
          description: Additional information about the test result.
          type: string
          example: Timeout connecting to phonehome endpoint
        success:
          description: 'Whether the object being tested passed the test or not.

            Returns a value of `true` if the specified test has succeeded.

            Returns a value of `false` if the specified test has failed.

            '
          type: boolean
        test_type:
