            description: 'The amount of time left, measured in milliseconds, until the destroyed policy is

              permanently eradicated.

              '
            type: integer
            format: int64
            readOnly: true
          workload:
            $ref: '#/components/schemas/_workloadConfigurationFixedReference'
    _policyruleusergroupquotapostRules:
      type: object
      properties:
        enforced:
          description: 'If set to `true`, the quota is enforced and an out-of-space warning is issued

            if logical space usage exceeds the specified limit.

            If set to `false`, the quota is not enforced and alerts and/or notifications are

            issued when logical space usage exceeds the limit value.

            If not specified, defaults to `false`.

            '
          type: boolean
        notifications:
          description: 'Targets to notify when usage approaches or exceeds the quota limit.

            Valid non-empty values are `account` or `none`.

            The `account` value specifies that the user or group owning the usage

            will be notified, `none` specifies that notifications are not sent.

            If not specified, we assume `none`.

            '
          type: array
          items:
            type: string
        quota_limit:
          description: 'Logical space limit of the quota (in bytes) assigned by the rule.

            This value cannot be negative.

            '
          title: Policy_rule_user_group_quota_limit_type
          allOf:
          - $ref: '#/components/schemas/_policy_rule_user_group_quota_limit_type'
        quota_type:
          description: 'Specifies the type of quota rule. Valid values are `user-default`, `user`,

            `user-group-member`, `group-default` and `group`. Every user-group-quota

            rule requires a mandatory rule type.

            '
          type: string
        subject:
          description: 'The subject for which the rule applies. Rules of quota type `user`, `user-group-member`,

            `group` require a non-empty subject, while rules of quota type `user-default` and

            `group-default` do not have a subject.

            The subject identifies the accounts for which the quota rule applies.

            '
          title: PolicyruleusergroupquotaSubject
          allOf:
          - $ref: '#/components/schemas/_policyruleusergroupquotaSubject'
    PolicyRuleQuota:
      allOf:
      - $ref: '#/components/schemas/_context'
      - type: object
        properties:
          destroyed:
            description: 'Returns a value of `true` if the pod containing the quota policy rule has been destroyed and

              is pending eradication.

              The `time_remaining` value displays the amount of time left until the destroyed policy is

              permanently eradicated.

              Once the `time_remaining` period has elapsed, the quota policy rule is permanently

              eradicated and can no longer be recovered.

              '
            type: boolean
          enforced:
            description: 'Defines whether the quota rule is enforced or unenforced.

              If the quota rule is enforced and logical space usage exceeds the quota limit,

              any modification operations that result in a need for more space are blocked.

              If the quota rule is unenforced and logical space usage exceeds the quota limit, notification

              emails are sent to targets that are specified using the `notification` parameter.

              No client operations are blocked when an unenforced limit is exceeded.

              If set to `true`, the limit is enforced. If set to `false`, notification targets are informed

              when the usage exceeds 80 percent of the limit.

              '
            type: boolean
            readOnly: true
          name:
            description: 'Name of this rule. The name is automatically generated by the system.

              '
            type: string
            readOnly: true
          notifications:
            description: 'Targets to notify when usage approaches the quota limit.

              The list of notification targets is a comma-separated string.

              Valid values are `user`, and `group`.

              If not specified, notification targets are not assigned for the rule.

              '
            type: string
            readOnly: true
          policy:
            description: The policy to which this rule belongs.
            title: FixedReferenceWithType
            allOf:
            - $ref: '#/components/schemas/_fixedReferenceWithType'
          quota_limit:
            description: 'Logical space limit of the quota assigned by the rule, measured in bytes.

              This value cannot be set to 0.

              '
            type: integer
            format: int64
            readOnly: true
          time_remaining:
            description: 'The amount of time left, in milliseconds, until the destroyed quota policy rule is

              permanently eradicated.

              '
            type: integer
            format: int64
            readOnly: true
    PolicySmbPost:
      allOf:
      - $ref: '#/components/schemas/PolicyPost'
      - type: object
        properties:
          access_based_enumeration_enabled:
            description: 'If set to `true`, enables access based enumeration on the policy.

              When access based enumeration is enabled on a policy,

              files and folders within exports that are attached to the policy

              will be hidden from users who do not have permission to view them.

              If not specified, defaults to `false`.

              '
            type: boolean
          continuous_availability_enabled:
            description: 'Returns a value of `true` if continuous availability is enabled on the policy.

              When continuous availability is enabled on a policy,

              file shares are accessible during otherwise disruptive scenarios such as

              temporary network outages, controller upgrades or failovers.

              If not specified, defaults to `false`.

