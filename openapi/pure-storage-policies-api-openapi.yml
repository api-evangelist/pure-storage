              Only applies to passwords longer than 6 characters.

              '
            type: boolean
            example: true
          enforce_username_check:
            description: 'If `true`, the username cannot be a substring of the password.

              It only applies to usernames of 3 characters and longer.

              '
            type: boolean
            example: true
          lockout_duration:
