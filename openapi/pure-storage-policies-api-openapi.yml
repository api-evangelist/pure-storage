          description: 'Updates rules in a policy and accepts a single-rule update object. The list can contain

            only one item that will update all the specified rules.

            '
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/_policyrulequotapatchRules'
    _policyruleusergroupquotapatchRules:
      allOf:
      - type: object
        properties:
          enforced:
            description: 'The enforcement policy for the quota. When set to `true`, the quota is

              enforced and an out-of-space warning is issued if `logical space` usage

              exceeds the limit. When set to `false`, the quota is not enforced,

              and only alerts or notifications are issued upon exceeding the limit.

              The default value is `false` if the property is not specified.

              '
            type: boolean
          notifications:
            description: 'The entities to notify when usage approaches or exceeds the quota limit.

              Valid non-empty values include `account`, which notifies the `user` or

              `group` owning the usage, or `none`, which specifies that no

              notifications are sent. The default value is `none` if the property

              is not specified.

              '
            type: array
            items:
              type: string
      - $ref: '#/components/schemas/_policy_rule_user_group_quota_limit_patch'
    PolicyRuleNfsClient:
      allOf:
      - $ref: '#/components/schemas/_context'
      - type: object
        properties:
          access:
            description: 'Specifies access control for the export. Valid values are `root-squash`, `all-squash`,

              and `no-root-squash`.

              `root-squash` prevents client users and groups with root privilege from mapping their

              root privilege to a file system. All users with UID 0 will have their UID mapped to

              anonuid. All users with GID 0 will have their GID mapped to anongid.

              `all-squash` maps all UIDs (including root) to anonuid and all GIDs (including root) to

              anongid.

              `no-root-squash` allows users and groups to access the file system with their UIDs and GIDs.

              The default is `root-squash` if not specified.

              '
            type: string
            readOnly: true
          anongid:
            description: 'Any user whose GID is affected by an `access` of `root_squash` or `all_squash` will have

              their GID mapped to `anongid`. The default `anongid` is null, which means 65534.

              Use "" to clear.

              This value is ignored when user mapping is enabled - see User Guide for more details.

              '
            type: string
            readOnly: true
            example: '65530'
          anonuid:
            description: 'Any user whose UID is affected by an `access` of `root_squash` or `all_squash` will have

              their UID mapped to `anonuid`. The default `anonuid` is null, which means 65534.

              Use "" to clear.

              '
            type: string
            readOnly: true
            example: '65530'
          client:
            description: 'Specifies the clients that will be permitted to access the export.

              Accepted notation includes IP, IP mask, or hostname.

              The default is `*` if not specified.

              '
            type: string
            readOnly: true
          destroyed:
            description: 'Returns a value of `true` if the pod containing the NFS policy rule has been destroyed and

              is pending eradication.

              The `time_remaining` value displays the amount of time left until the destroyed policy is

              permanently eradicated.

              Once the `time_remaining` period has elapsed, the NFS policy rule is permanently eradicated

              and can no longer be recovered.

              '
            type: boolean
          name:
            description: 'Name of this rule. The name is automatically generated by the system.

              '
            type: string
            readOnly: true
          nfs_version:
            description: 'The NFS protocol version allowed for the export. Valid values are `nfsv3` and `nfsv4`.

              '
            type: array
            items:
              type: string
              example: nfsv3
          permission:
            description: 'Specifies which read-write client access permissions are allowed for the export.

              Valid values are `rw` and `ro`. The default is `rw` if not specified.

              '
            type: string
            readOnly: true
          policy:
            description: The policy to which this rule belongs.
            title: FixedReferenceWithType
            allOf:
            - $ref: '#/components/schemas/_fixedReferenceWithType'
          security:
            description: 'The security flavors to use for accessing files on this mount point.

              Values include `auth_sys`, `krb5`, `krb5i`, and `krb5p`.

              If the server does not support the requested flavor, the mount operation fails.

              This operation updates all rules of the specified policy.

              If `auth_sys`, the client is trusted to specify the identity of the user.

              If `krb5`, cryptographic proof of the identity of the user is provided in each RPC request.

              This provides strong verification of the identity of users accessing data on the server.

              Note that additional configuration besides adding this mount option is required to

              enable Kerberos security. If `krb5i`, integrity checking is added to krb5. This ensures

              the data has not been tampered with. If `krb5p`, integrity checking and encryption is added

              to krb5. This is the most secure setting, but it also involves the most performance

              overhead.

              '
            type: array
            items:
              type: string
              example: auth_sys
          time_remaining:
            description: 'The amount of time left, in milliseconds, until the destroyed NFS policy rule is permanently

              eradicated.

              '
            type: integer
            format: int64
            readOnly: true
