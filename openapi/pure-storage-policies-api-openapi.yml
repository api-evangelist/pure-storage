              number of login attempts. Ranges from 1 second to 90 days.

              '
            type: integer
            format: int64
            minimum: 1000
            maximum: 7776000000
            example: 3600000
          max_login_attempts:
            description: 'Maximum number of failed login attempts allowed before the user is locked out.

              '
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            example: 10
          max_password_age:
            description: 'The maximum age of password before password change is required.

              Ranges from 1 day to 99999 days, with 0 meaning password expiration is disabled.

              '
            type: integer
            format: int64
            minimum: 0
            maximum: 8639913600000
            example: 86400000
          min_character_groups:
            description: 'The minimum number of character groups ([a-z], [A-Z], [0-9], other) required to be present

              in a password.

              '
            type: integer
            format: int32
            minimum: 0
            maximum: 4
            example: 3
          min_characters_per_group:
            description: 'The minimum number of characters per group to count the group as present.

              Maximum is limited by the minimum password length divided by the number of character groups

              (e.g. min_password_length = 9, min_character_groups = 4, then maximum is 2).

              '
            type: integer
            format: int32
            minimum: 1
            example: 1
          min_password_age:
            description: 'The minimum age, in milliseconds, of password before password change is allowed.

              Ranges from 0 ms to 7 days

              '
            type: integer
            format: int64
            minimum: 0
            maximum: 604800000
            example: 86400000
          min_password_length:
            description: 'Minimum password length. If not specified, defaults to 1.

              '
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            example: 1
          password_history:
            description: 'The number of passwords tracked to prevent reuse of passwords.

              '
            type: integer
            format: int32
            minimum: 0
            maximum: 64
            example: 5
