    PolicyRuleUserGroupQuota:
      allOf:
      - $ref: '#/components/schemas/_context'
      - type: object
        properties:
          destroyed:
            description: 'Returns a value of `true` if the pod containing the user-group-quota policy rule has been

              destroyed and is pending eradication.

              The `time_remaining` value displays the amount of time left until the destroyed policy is

              permanently eradicated.

              Once the `time_remaining` period has elapsed, the user-group-quota policy rule is

              permanently eradicated and can no longer be recovered.

              '
            type: boolean
          enforced:
            description: 'Specifies whether the user-group-quota rule is enforced or unenforced.

              If the user-group-quota rule is enforced and user/group space usage exceeds the quota limit,

              any modification operations that result in a need for more space are blocked.

              If the quota rule is unenforced and logical space usage exceeds the quota limit,

              notification emails are sent to targets that are specified using the `notification`

              parameter.

              No client operations are blocked when an unenforced limit is exceeded.

              If set to `true`, the limit is enforced. If set to `false`, the quota limit is enforced.

              '
            type: boolean
            readOnly: true
          name:
            description: 'Name of the rule. The name is automatically generated by the system.

              '
            type: string
            readOnly: true
          notifications:
            description: 'Specifies the targets to notify when usage approaches or exceeds the quota limit.

              `empty` specifies that no targets will be notified.

              The `account` value specifies that the user or group owning the usage

              will be notified.

              '
            type: array
            items:
              type: string
          policy:
            description: 'The policy to which this rule belongs.

              '
            title: FixedReferenceWithType
            allOf:
            - $ref: '#/components/schemas/_fixedReferenceWithType'
          quota_limit:
            description: 'Logical space limit of the quota assigned by the rule, measured in bytes.

              The value cannot be negative.

              '
            type: integer
            format: int64
            readOnly: true
          quota_type:
            description: 'Specifies the type of quota rule. Valid values are `user-default`, `user`,

              `user-group-member`, `group-default` and `group`. Every user-group-quota rule has a rule

              type, and this field is always populated.

              '
            type: string
            readOnly: true
          subject:
            description: 'The rule subject, when required.

              Rules of type `user`, `user-group-member` and `group` require a subject, specifying the

              user or group the rule is applicable to.

              '
            title: PolicyRuleUserGroupQuotaSubject
            allOf:
            - $ref: '#/components/schemas/PolicyRuleUserGroupQuotaSubject'
          time_remaining:
            description: 'The amount of time left, in milliseconds, until the destroyed user-group-quota policy rule

              is permanently eradicated.

              '
            type: integer
            format: int64
            readOnly: true
