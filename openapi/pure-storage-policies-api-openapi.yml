            description: 'When this is set to `least-common-permissions`, any users to whom this policy applies can

              receive no access rights exceeding those defined in this policy''s rules.

              When this is set to `all-permissions`, any users to whom this policy applies are capable of

              receiving additional access rights from other policies that apply to them.

              '
            type: string
