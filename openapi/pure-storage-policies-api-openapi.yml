          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyManagementAccessGetResponse'
    post:
      tags:
      - Policies
      summary: Pure Storage Create Management Access Policies
      description: 'Creates one or more management access policies.

        To copy a policy, one of `source_names` or `source_ids` is required.

        To create a policy from scratch, policy body is required.


        '
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/Context_names'
      - $ref: '#/components/parameters/Names_required'
      - $ref: '#/components/parameters/Source_ids'
      - $ref: '#/components/parameters/Source_names'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyManagementAccessPost'
        required: false
        x-codegen-request-body-name: policy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyManagementAccessResponse'
      x-codegen-request-body-name: policy
    delete:
